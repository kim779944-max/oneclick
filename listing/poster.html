<!doctype html>
<html lang="ko" data-kts-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물건표 · 프리미엄 1장 브리핑 (가로 16:9 · 세로 9:16) | KTS</title>
<meta name="description" content="대표 사진·전체 제원·핵심 포인트·감동의 글·투자 조건을 한 장에. 가로 16:9 · 세로 9:16으로 바로 저장(PNG·PDF)하고 카톡·문자로 보냅니다.">
<meta name="theme-color" content="#0B1526">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.png">
<link rel="canonical" href="https://autooneclick.com/listing/poster.html">
<link rel="stylesheet" href="poster.css?v=20261128b">
</head>
<body>

<div class="topbar noprint">
  <a class="back" href="./" aria-label="매물장으로">‹</a>
  <b>물건표</b>
  <span class="sp"></span>
  <div class="oswitch" id="oswitch">
    <button type="button" data-o="land" class="on">가로</button>
    <button type="button" data-o="port">세로</button>
  </div>
  <button type="button" class="save" id="btnSave">저장</button>
  <button type="button" class="dots" id="btnTools" aria-label="도구">⋯</button>
</div>

<main class="stage" id="stage">
  <div class="pwrap" id="pwrap"></div>
  <p class="hint noprint" id="hint">글자를 누르면 그 자리에서 고칠 수 있습니다</p>
</main>

<!-- 손님 화면 — 도구 없이 「이미지 받기」와 전화만 -->
<div class="guestbar noprint" id="guestbar" hidden>
  <a class="gbtn call" id="gCall" href="#">전화</a>
  <button class="gbtn get" id="gGet" type="button">이미지 받기</button>
</div>

<!-- 도구 시트 -->
<div class="sheet noprint" id="sheet" hidden>
  <div class="sh-in">
    <div class="grip"></div>
    <div class="sh-h"><b>물건표 도구</b><button class="x" id="shX" type="button" aria-label="닫기">✕</button></div>
    <div class="sh-b" id="shBody"></div>
  </div>
</div>

<!-- 저장 — 규격 선택 + 확대 미리보기(264번) -->
<div class="modal noprint" id="modal" hidden>
  <div class="md-in">
    <div class="md-h"><b>저장</b><button class="x" id="mdX" type="button" aria-label="닫기">✕</button></div>
    <div class="md-scroll" id="mdScroll"><div class="md-stage" id="mdStage"></div></div>
    <div class="md-b">
      <div class="oswitch wide" id="mdOrient">
        <button type="button" data-r="land" class="on">가로 16:9</button>
        <button type="button" data-r="port">세로 9:16</button>
        <button type="button" data-r="both">둘 다</button>
      </div>
      <div class="md-acts">
        <button type="button" class="btn main" id="mdPng">PNG 저장</button>
        <button type="button" class="btn" id="mdPdf">PDF 저장</button>
      </div>
      <p class="md-note" id="mdNote">손가락으로 벌려 크게 확인한 뒤 저장하세요.</p>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div class="edov" id="edov" hidden><textarea id="edta" spellcheck="false"></textarea></div>

<script src="../shared/profile-sync.js?v=20261128b"></script>
<script src="../bizcard/vendor/qrcode.js?v=20261128b"></script>
<script src="../bizcard/seal.js?v=20261128b"></script>
<script src="../bizcard/premium.js?v=20261128b"></script>
<script src="../bizcard/shorturl.js?v=20261128b"></script>
<script src="../shared/visit.js?v=20261128b" defer></script>
<script src="poster.js?v=20261128b"></script>
</body>
</html>
