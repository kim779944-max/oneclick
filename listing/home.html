<!doctype html>
<html lang="ko" data-kts-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중개사 홈페이지 — 다른 매물 · 케이티에스 원클릭</title>
<meta name="description" content="이 중개사의 다른 매물 — 조건 필터 · 투자자/실사용자 보기 전환 · 매물장 바로 열기">
<meta name="theme-color" content="#0b132b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="매물장">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.png">
<link rel="stylesheet" href="../shared/kts-tokens.css">
<link rel="stylesheet" href="../shared/kts-ui.css">
<style>
:root{--bg:var(--k-bg);--panel:var(--k-panel);--line:var(--k-line);--muted:var(--k-ink-2);--accent:#ff6b00;--ink:var(--k-ink);--p2:#1f2b44;--p3:#19253d;--b2:#39455f;--hd:#0c152b;--unk:#8391ab}
html[data-kts-theme="light"]{--p2:#f1f3f7;--p3:#f6f7f9;--b2:#d3d9e3;--hd:#ffffff;--unk:#8794a5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--k-font);word-break:keep-all;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button,a{font:inherit;cursor:pointer;color:inherit;text-decoration:none}
button{border:0;background:none;padding:0}
:focus-visible{outline:2px solid #ff994b;outline-offset:3px}
h1,h2,p{margin:0}
svg{width:16px;height:16px;flex-shrink:0}
.bar{position:sticky;top:0;z-index:5;height:48px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;background:var(--hd);border-bottom:1px solid var(--line)}
.brandicon{height:20px;display:flex;align-items:flex-end;gap:2px}
.brandicon i{width:5px;background:var(--accent);height:12px;transform:skewY(-16deg);border-radius:1px}
.brandicon i:nth-child(2){height:17px}.brandicon i:nth-child(3){height:21px}
.bar b{font-size:15px;letter-spacing:-.4px}
.bar .sp{flex:1}
.bar .k-theme{width:44px;height:44px;min-height:44px}
.wrap{max-width:760px;margin:auto;padding:0 16px}
.prof{margin-top:14px;border:1px solid #69432c;border-radius:12px;background:var(--panel);padding:16px}
.prof h1{font-size:22px;letter-spacing:-.6px}
.prof h1 small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.prof p{color:var(--muted);font-size:13px;margin-top:2px}
.prof p b{color:var(--ink);font-weight:600}
.btnrow{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:7px;margin-top:12px}
.btn{min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--b2);border-radius:8px;background:var(--p3);font-size:13px;font-weight:650;padding:0 8px;white-space:nowrap}
.btn.or{background:var(--accent);border-color:var(--accent);color:#171d29}
h2{font-size:17px;letter-spacing:-.5px;margin:22px 0 10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--b2);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;font-weight:700;font-size:14px;background:var(--p3);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#171d29}
.segnote{font-size:12px;color:var(--muted);margin:6px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--b2);background:var(--p3);font-size:13px;font-weight:650}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:#ff8126;background:#2a1d14}
html[data-kts-theme="light"] .chips button[aria-pressed="true"]{background:#fff1e6;color:#c2410c}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.nums label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.nums input{min-height:44px;border-radius:8px;border:1px solid var(--b2);background:var(--panel);color:var(--ink);padding:0 12px;font:inherit;font-size:15px;width:100%}
.count{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px;font-size:14px}
.count b{color:#ff8126}
.count button{min-height:44px;padding:0 12px;border-radius:8px;border:1px solid var(--b2);font-size:13px}
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:104px 1fr;gap:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px;min-height:44px}
.card img{width:104px;height:78px;object-fit:cover;border-radius:8px;display:block}
.card .t{font-weight:750;font-size:15px;letter-spacing:-.3px}
.card .a{font-size:12px;color:var(--muted)}
.card .chipline{display:flex;gap:5px;margin-bottom:3px}
.chip{border-radius:5px;padding:1px 7px;font-weight:650;font-size:11px;border:1px solid #8791a14a;background:var(--p2)}
.chip.deal{background:var(--accent);border-color:var(--accent);color:#141414}
.kv{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid var(--line);padding-top:8px}
.kv div{font-size:11px;color:var(--muted);min-width:0}
.kv b{display:block;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv .hl b{color:#ff8126}
.unk{color:var(--unk);font-weight:500}
.empty{border:1.5px dashed var(--b2);border-radius:12px;padding:22px 14px;text-align:center;color:var(--muted)}
.empty .btn{margin:12px auto 0;max-width:200px}
.foot{font-size:12px;color:var(--muted);line-height:1.6;margin-top:22px}
</style>
<link rel="stylesheet" href="../shared/kts-print.css">
<script src="../shared/kts-ui.js" defer></script>
</head>
<body>
<div class="bar"><span class="brandicon" aria-hidden="true"><i></i><i></i><i></i></span><b id="barNm">중개사 홈페이지</b><span class="sp"></span><button class="k-theme" type="button"></button></div>
<main class="wrap">
  <section class="prof" id="prof"><h1>불러오는 중…</h1></section>

  <h2>이 중개사의 다른 매물</h2>
  <div class="seg" role="group" aria-label="보기 전환">
    <button type="button" data-view="inv" aria-pressed="true">투자자</button>
    <button type="button" data-view="use" aria-pressed="false">실사용자</button>
  </div>
  <p class="segnote" id="segNote">수익률 높은 순 · 수익률·실투자금·월세를 먼저 보여 드립니다.</p>

  <div class="chips" role="group" aria-label="조건 필터">
    <button type="button" data-f="p40" aria-pressed="false">40억 이하</button>
    <button type="button" data-f="y6" aria-pressed="false">수익률 6% 이상</button>
    <button type="button" data-f="now" aria-pressed="false">즉시 입주</button>
  </div>
  <div class="nums">
    <label>가격 상한(억 원)<input id="maxP" type="number" inputmode="decimal" min="0" step="0.5" placeholder="예: 40"></label>
    <label>수익률 하한(%)<input id="minY" type="number" inputmode="decimal" min="0" step="0.1" placeholder="예: 6"></label>
  </div>

  <div class="count"><span id="cnt" aria-live="polite"></span><button type="button" id="clr">필터 지우기</button></div>
  <div class="list" id="list"></div>

  <p class="foot">예시 매물입니다(가상 데이터) · 비공개 매물은 이 목록과 개수에서 빠지고, 중개사가 보낸 직접 링크로만 열립니다 · 수익률은 층별 임대차 표의 월세 합계 × 12 ÷ 실투자금으로 계산합니다 · 서버 전송·업로드 없음 · autooneclick.com</p>
</main>
<script>
(function () {
  'use strict';
  var UNK = '<span class="unk">미확인</span>';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function has(v) { return v !== null && v !== undefined && v !== ''; }
  function num(n) { return Number(n).toLocaleString('ko-KR', { maximumFractionDigits: 1 }); }
  function eok(n) { if (!has(n)) return null; n = Number(n); if (Math.abs(n) < 10000) return num(n) + '만'; return num(Math.round(n / 1000) / 10) + '억'; }
  function digits(s) { return String(s || '').replace(/[^0-9+]/g, ''); }
  function thumbOf(src) { return /^img\/[^?]+\.jpg$/.test(src) ? src.replace(/\.jpg$/, '_sm.jpg') : src; }
  /* index.html 의 calc() 와 같은 식 */
  function calc(l) {
    var p = l.price || {}, dep = 0, rent = 0, dn = 0, rn = 0;
    (l.leases || []).forEach(function (r) { if (has(r.deposit)) { dep += +r.deposit; dn++; } if (has(r.rent)) { rent += +r.rent; rn++; } });
    var c = { dep: dn ? dep : null, rent: rn ? rent : null };
    var riCalc = has(p.sale) && has(p.loanAmount) && c.dep != null ? p.sale - p.loanAmount - c.dep : null;
    c.ri = has(p.realInvest) ? +p.realInvest : riCalc;
    c.y = c.rent != null && c.ri > 0 ? c.rent * 12 / c.ri * 100 : null;
    return c;
  }
  var ALL = [], BRK = {}, VIEW = 'inv', F = { p40: false, y6: false, now: false };

  function vcard(b) {
    function v(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
    var nm = String(b.name || ''), L = ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + v(nm.slice(0, 1)) + ';' + v(nm.slice(1)) + ';;;', 'FN:' + v(nm), 'ORG:' + v(b.office), 'TITLE:' + v(b.title || '공인중개사')];
    if (b.phone) L.push('TEL;TYPE=CELL:' + b.phone); if (b.email) L.push('EMAIL:' + b.email);
    if (b.address) L.push('ADR:;;' + v(b.address) + ';;;;'); if (b.regno) L.push('NOTE:등록번호 ' + v(b.regno));
    L.push('END:VCARD'); return L.join('\r\n') + '\r\n';
  }

  function prof() {
    var b = BRK;
    document.getElementById('barNm').textContent = (b.name || '중개사') + ' 공인중개사';
    document.getElementById('prof').innerHTML = '<h1>' + esc(b.name) + '<small>' + esc(b.title || '공인중개사') + '</small></h1>' +
      '<p><b>' + esc(b.office) + '</b> · 등록번호 ' + esc(b.regno || '미확인') + '</p><p>전화 <b>' + esc(b.phone || '미확인') + '</b> · ' + esc(b.address || '') + '</p>' +
      '<div class="btnrow"><a class="btn" role="button" href="tel:' + digits(b.phone) + '">전화</a><a class="btn" role="button" href="sms:' + digits(b.phone) + '?body=' + encodeURIComponent('[KTS 매물문의] 매물 상담을 요청드립니다.') + '">문자</a>' +
      '<a class="btn or" role="button" href="./">매물장 보기</a></div>' +
      '<div class="btnrow" style="grid-template-columns:1fr"><a class="btn" role="button" id="vcf" href="broker.vcf" download>연락처 저장(.vcf)</a></div>';
    document.getElementById('vcf').addEventListener('click', function (e) {
      try { var u = URL.createObjectURL(new Blob([vcard(b)], { type: 'text/vcard;charset=utf-8' })), a = document.createElement('a'); a.href = u; a.download = (b.name || '연락처') + '.vcf'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); e.preventDefault(); } catch (er) {}
    });
  }

  function draw() {
    var maxP = parseFloat(document.getElementById('maxP').value), minY = parseFloat(document.getElementById('minY').value);
    var pub = ALL.filter(function (l) { return !l.private; });            // 비공개는 목록·개수 모두에서 제외
    var res = pub.filter(function (l) {
      var p = l.price || {}, c = l._c;
      if (F.p40 && !(has(p.sale) && p.sale <= 400000)) return false;
      if (F.y6 && !(c.y != null && c.y >= 6)) return false;
      if (F.now && l.moveIn !== '즉시') return false;
      if (!isNaN(maxP) && !(has(p.sale) && p.sale <= maxP * 10000)) return false;
      if (!isNaN(minY) && !(c.y != null && c.y >= minY)) return false;
      return true;
    });
    res.sort(VIEW === 'inv'
      ? function (a, b) { return (b._c.y == null ? -1 : b._c.y) - (a._c.y == null ? -1 : a._c.y); }
      : function (a, b) { return (+b.gross || 0) - (+a.gross || 0); });
    document.getElementById('cnt').innerHTML = '<b>' + pub.length + '건 중 ' + res.length + '건</b>';
    var L = document.getElementById('list');
    if (!res.length) { L.innerHTML = '<div class="empty">조건에 맞는 매물이 없습니다<br><button class="btn" type="button" id="clr2">필터 지우기</button></div>'; document.getElementById('clr2').addEventListener('click', clear); return; }
    L.innerHTML = res.map(function (l) {
      var p = l.price || {}, c = l._c, f = l.facts || {};
      var kv = VIEW === 'inv'
        ? [['수익률', c.y != null ? c.y.toFixed(1) + '%' : null, 1], ['실투자금', eok(c.ri), 1], ['월세', c.rent != null ? num(c.rent) + '만' : null, 1], ['매매가', eok(p.sale)]]
        : [['층', l.floors || null, 1], ['면적', f.gross || null, 1], ['주차', has(f.parking) ? f.parking + '대' : null, 1], ['입주', l.moveIn || null, 1]];
      return '<a class="card" href="./?m=' + encodeURIComponent(l.id) + '" data-id="' + esc(l.id) + '"><img src="' + esc(thumbOf((l.photos || [])[0] || '')) + '" alt="" loading="lazy">' +
        '<div><div class="chipline"><span class="chip deal">' + esc(l.deal) + '</span><span class="chip">' + esc(l.type) + '</span></div><p class="t">' + esc(l.title) + '</p><p class="a">' + esc(l.address) + '</p>' +
        '<p class="a">' + esc(l.id) + ' · ' + (eok(p.sale) ? '매매 ' + eok(p.sale) : '가격 미확인') + '</p></div>' +
        '<div class="kv">' + kv.map(function (x) { return '<div class="' + (x[2] ? 'hl' : '') + '">' + x[0] + '<b>' + (x[1] != null ? esc(x[1]) : UNK) + '</b></div>'; }).join('') + '</div></a>';
    }).join('');
  }
  function clear() { F = { p40: false, y6: false, now: false }; document.getElementById('maxP').value = ''; document.getElementById('minY').value = ''; sync(); draw(); }
  function sync() { Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (b) { b.setAttribute('aria-pressed', F[b.getAttribute('data-f')] ? 'true' : 'false'); }); }

  Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (b) { b.addEventListener('click', function () { var k = b.getAttribute('data-f'); F[k] = !F[k]; sync(); draw(); }); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (b) {
    b.addEventListener('click', function () {
      VIEW = b.getAttribute('data-view');
      Array.prototype.forEach.call(document.querySelectorAll('[data-view]'), function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      document.getElementById('segNote').textContent = VIEW === 'inv' ? '수익률 높은 순 · 수익률·실투자금·월세를 먼저 보여 드립니다.' : '면적 넓은 순 · 층·면적·주차·입주를 먼저 보여 드립니다.';
      draw();
    });
  });
  document.getElementById('maxP').addEventListener('input', draw);
  document.getElementById('minY').addEventListener('input', draw);
  document.getElementById('clr').addEventListener('click', clear);

  Promise.all([fetch('data/listings.json').then(function (r) { return r.json(); }), fetch('data/broker.json').then(function (r) { return r.json(); })]).then(function (a) {
    ALL = (a[0].listings || []).map(function (l) { l._c = calc(l); return l; }); BRK = a[1] || {}; prof(); draw();
  }).catch(function () { document.getElementById('list').innerHTML = '<div class="empty">매물 정보를 불러오지 못했습니다.</div>'; });
})();
</script>
</body>
</html>
