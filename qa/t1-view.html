<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>트랙1 화면 검수</title>
<meta name="robots" content="noindex,nofollow">
<style>html,body{margin:0;background:#20232a;color:#d7dae0;font-family:system-ui,sans-serif}
.bar{padding:7px 10px;font-size:12px;font-weight:800}
.wrap{display:inline-block;border:1px solid #444}
iframe{border:0;display:block;background:#fff}</style></head>
<body>
<div class="bar" id="lb">—</div>
<div class="wrap"><iframe id="f" src="/area/" width="390" height="844" title="검수 화면"></iframe></div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var u=q.get('u')||'/area/', w=+(q.get('w')||390), h=+(q.get('h')||844);
  var f=document.getElementById('f'); f.src=u; f.width=w; f.height=h;
  document.getElementById('lb').textContent=u+' · '+w+'×'+h;
})();
</script>
</body></html>
