<script>

/* ---------- ZIP 리더 (xlsx / hwpx 공통, 파일 → 메모리에서만) ---------- */
async function readZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('zip 구조를 찾지 못했습니다');
  const cdCount = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let n = 0; n < cdCount; n++){
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const usize = dv.getUint32(off + 24, true);
    const nlen = dv.getUint16(off + 28, true);
    const elen = dv.getUint16(off + 30, true);
    const clen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(u8.slice(off + 46, off + 46 + nlen));
    files[name] = {method, csize, usize, lho};
    off += 46 + nlen + elen + clen;
  }
  async function get(name){
    const f = files[name]; if (!f) return null;
    const lh = f.lho;
    const nlen = dv.getUint16(lh + 26, true), elen = dv.getUint16(lh + 28, true);
    const start = lh + 30 + nlen + elen;
    const data = u8.slice(start, start + f.csize);
    if (f.method === 0) return new TextDecoder().decode(data);
    const ds = new DecompressionStream('deflate-raw');
    const ab = await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();
    return new TextDecoder().decode(ab);
  }
  return {names: Object.keys(files), get};
}

const xmlParse = s => new DOMParser().parseFromString(s, 'application/xml');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------- XLSX ---------- */
async function xlsxStyles(z){
  const st = {fonts: [], fills: [], xfs: []};
  const xml = await z.get('xl/styles.xml');
  if (!xml) return st;
  const doc = xmlParse(xml), root = doc.documentElement;
  const kids = el => [...el.children];
  const fontsEl = kids(root).find(e => e.localName === 'fonts');
  if (fontsEl) st.fonts = kids(fontsEl).map(f => {
    const b = kids(f).some(x => x.localName === 'b');
    const c = kids(f).find(x => x.localName === 'color');
    const sz = kids(f).find(x => x.localName === 'sz');
    let color = '';
    const rgb = c && c.getAttribute('rgb');
    if (rgb && /^FF[0-9A-Fa-f]{6}$/.test(rgb)) color = '#' + rgb.slice(2);
    else if (rgb && /^[0-9A-Fa-f]{6}$/.test(rgb)) color = '#' + rgb;
    return {b, color, sz: sz ? +sz.getAttribute('val') : 11};
  });
  const fillsEl = kids(root).find(e => e.localName === 'fills');
  if (fillsEl) st.fills = kids(fillsEl).map(f => {
    const pf = kids(f).find(x => x.localName === 'patternFill');
    if (!pf || pf.getAttribute('patternType') !== 'solid') return '';
    const fg = kids(pf).find(x => x.localName === 'fgColor');
    const rgb = fg && fg.getAttribute('rgb');
    return rgb && /^FF[0-9A-Fa-f]{6}$/.test(rgb) ? '#' + rgb.slice(2) : '';
  });
  const xfsEl = kids(root).find(e => e.localName === 'cellXfs');
  if (xfsEl) st.xfs = kids(xfsEl).map(x => {
    const al = kids(x).find(k => k.localName === 'alignment');
    return {font: +x.getAttribute('fontId') || 0, fill: +x.getAttribute('fillId') || 0, align: al ? (al.getAttribute('horizontal') || '') : ''};
  });
  return st;
}
async function openXlsx(buf){
  const z = await readZip(buf);
  const shared = await z.get('xl/sharedStrings.xml');
  let strs = [];
  if (shared){
    const doc = xmlParse(shared);
    strs = [...doc.getElementsByTagName('si')].map(si =>
      [...si.getElementsByTagName('t')].map(t => t.textContent).join(''));
  }
  const ST = await xlsxStyles(z);
  const sheetName = z.names.find(n => /^xl\/worksheets\/sheet1\.xml$/.test(n)) || z.names.find(n => /^xl\/worksheets\/.*\.xml$/.test(n));
  const sheet = await z.get(sheetName);
  const doc = xmlParse(sheet);
  const rows = [...doc.getElementsByTagName('row')];
  const grid = [];
  let maxc = 0;
  const merges = {};
  const mc = doc.getElementsByTagName('mergeCell');
  for (const m of mc){
    const ref = m.getAttribute('ref'); if (!ref) continue;
    const [a, b] = ref.split(':');
    const A = refParts(a), B = refParts(b);
    merges[A.r + ',' + A.c] = {rs: B.r - A.r + 1, cs: B.c - A.c + 1};
    for (let r = A.r; r <= B.r; r++) for (let c = A.c; c <= B.c; c++){
      if (r === A.r && c === A.c) continue;
      merges['x' + r + ',' + c] = true;
    }
  }
  let colWidths = [];
  const colsEl = [...doc.getElementsByTagName('col')];
  for (const c of colsEl){
    const mn = +c.getAttribute('min'), mx = +c.getAttribute('max'), w = parseFloat(c.getAttribute('width') || '0');
    for (let i = mn; i <= mx; i++) colWidths[i - 1] = w || 0;
  }
  for (const row of rows){
    const r = +row.getAttribute('r') - 1;
    const arr = grid[r] || (grid[r] = []);
    for (const c of row.getElementsByTagName('c')){
      const ref = c.getAttribute('r');
      const {c: ci} = refParts(ref);
      const t = c.getAttribute('t');
      let v = '';
      const vEl = c.getElementsByTagName('v')[0];
      const isEl = c.getElementsByTagName('is')[0];
      if (t === 's' && vEl) v = strs[+vEl.textContent] ?? '';
      else if (t === 'inlineStr' && isEl) v = [...isEl.getElementsByTagName('t')].map(x => x.textContent).join('');
      else if (vEl) v = vEl.textContent;
      const s = +c.getAttribute('s') || 0;
      arr[ci] = {v, num: !isNaN(v) && v !== '' && (t === 'n' || t === null), s};
      maxc = Math.max(maxc, ci);
    }
  }
  const nCols = maxc + 1;
  const hasStyle = ST.fills.some((f, i) => i > 1 && f) || ST.fonts.some(f => f.b || f.color);
  let cg = '';
  if (colWidths.length){
    const tot = colWidths.slice(0, nCols).reduce((a, b) => a + b, 0) || 1;
    cg = '<colgroup>' + Array.from({length: nCols}, (_, i) => `<col style="width:${Math.round((colWidths[i] || 8.43) / tot * 1000) / 10}%">`).join('') + '</colgroup>';
  }
  let html = `<table class="xl${cg ? ' fixed' : ''}">` + cg;
  for (let r = 0; r < grid.length; r++){
    if (!grid[r]) continue;
    html += '<tr>';
    for (let c = 0; c <= maxc; c++){
      if (merges['x' + r + ',' + c]) continue;
      const cell = grid[r][c] || {v: '', num: false, s: 0};
      const m = merges[r + ',' + c];
      const attr = (m ? ` rowspan="${m.rs}" colspan="${m.cs}"` : '');
      const xf = ST.xfs[cell.s] || {};
      const fnt = ST.fonts[xf.font] || {};
      const bg = ST.fills[xf.fill] || '';
      const style = [bg ? 'background:' + bg : '', fnt.color ? 'color:' + fnt.color : '', xf.align ? 'text-align:' + (xf.align === 'center' ? 'center' : (xf.align === 'right' ? 'right' : 'left')) : (cell.num ? 'text-align:right' : '')].filter(Boolean).join(';');
      const cls = [cell.num ? 'num' : '', fnt.b ? 'b' : ''].filter(Boolean).join(' ');
      let vshow = cell.v;
      if (cell.num && /^-?\d+(\.\d+)?$/.test(String(cell.v))) vshow = (+cell.v).toLocaleString('ko-KR');
      html += `<td${attr}${cls ? ` class="${cls}"` : ''}${style ? ` style="${style}"` : ''}>${esc(vshow)}</td>`;
    }
    html += '</tr>';
  }
  html += '</table>';
  return {kind: 'table', html, paper: hasStyle, note: '엑셀 · ' + (grid.length) + '행 × ' + nCols + '열' + (mc.length ? ` · 병합 ${mc.length}개` : '')};
}
function refParts(ref){
  const m = /^([A-Z]+)(\d+)$/.exec(ref || 'A1');
  let col = 0; for (const ch of m[1]) col = col * 26 + (ch.charCodeAt(0) - 64);
  return {c: col - 1, r: +m[2] - 1};
}

/* ---------- HWPX (병합·배경색·정렬·굵게까지 원본 그대로) ---------- */
async function openHwpx(buf){
  const z = await readZip(buf);
  const sec = z.names.find(n => /section0\.xml$/.test(n));
  if (!sec) throw new Error('hwpx 본문을 찾지 못했습니다');
  const xml = await z.get(sec);
  const headerXml = await z.get('Contents/header.xml');
  const LN = el => el.localName || String(el.tagName).replace(/^.*:/, '');
  const kids = el => [...el.children];
  const all = (el, name) => [...el.getElementsByTagName('*')].filter(x => LN(x) === name);
  const bgMap = {}, chMap = {}, paMap = {};
  if (headerXml){
    const hd = xmlParse(headerXml).documentElement;
    for (const bf of all(hd, 'borderFill')){
      const wb = all(bf, 'winBrush')[0];
      const face = wb ? (wb.getAttribute('faceColor') || '') : '';
      bgMap[bf.getAttribute('id')] = (face && !/^none$/i.test(face) && face.toUpperCase() !== '#FFFFFF') ? face : '';
    }
    for (const cp of all(hd, 'charPr')){
      const h = cp.getAttribute('height');
      chMap[cp.getAttribute('id')] = {bold: all(cp, 'bold').length > 0, color: cp.getAttribute('textColor') || '', h: h ? +h : 1000};
    }
    for (const pp of all(hd, 'paraPr')){
      const al = all(pp, 'align')[0];
      paMap[pp.getAttribute('id')] = al ? (al.getAttribute('horizontal') || '') : '';
    }
  }
  const doc = xmlParse(xml);
  const outA = [];
  let hasStyle = false, merged = 0, nRowsSeen = 0, nColsSeen = 0;
  const emitTable = tbl => {
    const trs = all(tbl, 'tr');
    nRowsSeen = Math.max(nRowsSeen, trs.length);
    // 열 폭: 모든 행에서 '한 칸짜리' 셀의 최대 폭을 열별로 모은다(첫 행은 병합이 많아 부정확)
    const colMax = [];
    let anySpan = 0;
    for (const tr of trs){
      let ci = 0;
      for (const tc of all(tr, 'tc')){
        const cs = +(all(tc, 'cellSpan')[0]?.getAttribute('colSpan') || 1);
        const sz = all(tc, 'cellSz')[0];
        const w = sz ? +sz.getAttribute('width') : 0;
        if (cs > 1){ anySpan = Math.max(anySpan, ci + cs); }
        for (let k = 0; k < cs; k++){
          const cw = w / cs;
          colMax[ci + k] = Math.max(colMax[ci + k] || 0, cw);
        }
        ci += cs;
      }
    }
    let colW = colMax.map(v => v || 0);
    if (!colW.length || colW.every(v => !v)){
      if (trs[0]) for (const tc of all(trs[0], 'tc')){
        const cs = +(all(tc, 'cellSpan')[0]?.getAttribute('colSpan') || 1);
        const w = +(all(tc, 'cellSz')[0]?.getAttribute('width') || 0);
        for (let k = 0; k < cs; k++) colW.push(cs ? w / cs : 0);
      }
    }
    nColsSeen = Math.max(nColsSeen, colW.length);
    const tw = colW.reduce((a, b) => a + b, 0) || 1;
    const fsz = colW.length >= 8 ? 8.8 : (colW.length >= 6 ? 9.4 : 10);
    let html = '<table class="xl fixed" style="font-size:' + fsz + 'px"><colgroup>' + colW.map(w => `<col style="width:${Math.round(w / tw * 1000) / 10}%">`).join('') + '</colgroup>';
    for (const tr of trs){
      html += '<tr>';
      for (const tc of all(tr, 'tc')){
        const sp = all(tc, 'cellSpan')[0];
        const cs = sp ? +(sp.getAttribute('colSpan') || 1) : 1;
        const rs = sp ? +(sp.getAttribute('rowSpan') || 1) : 1;
        if (cs > 1 || rs > 1){ merged++; hasStyle = true; }
        const paras = all(tc, 'p');
        const txt = paras.map(p => all(p, 't').map(t => t.textContent).join('')).join('\n');
        const pa = paras[0] ? (paMap[paras[0].getAttribute('paraPrIDRef')] || '') : '';
        const run = paras[0] ? all(paras[0], 'run')[0] : null;
        const cp = run ? (chMap[run.getAttribute('charPrIDRef')] || {}) : {};
        const bg = bgMap[tc.getAttribute('borderFillIDRef')] || '';
        if (bg || cp.bold) hasStyle = true;
        const stl = [bg ? 'background:' + bg : '', cp.color && cp.color.toUpperCase() !== '#000000' ? 'color:' + cp.color : '',
          pa === 'CENTER' ? 'text-align:center' : (pa === 'RIGHT' ? 'text-align:right' : '')].filter(Boolean).join(';');
        html += `<td${cs > 1 ? ` colspan="${cs}"` : ''}${rs > 1 ? ` rowspan="${rs}"` : ''}${cp.bold ? ' class="b"' : ''}${stl ? ` style="${stl}"` : ''}>${esc(txt)}</td>`;
      }
      html += '</tr>';
    }
    outA.push(html + '</table>');
  };
  const walk = (node) => {
    for (const el of kids(node)){
      const tag = LN(el);
      if (tag === 'p'){
        const tbls = all(el, 'tbl');
        if (tbls.length){ tbls.forEach(emitTable); continue; }
        const txt = all(el, 't').map(t => t.textContent).join('');
        if (txt.trim()) outA.push('<p>' + esc(txt) + '</p>');
      } else if (tag === 'tbl'){
        emitTable(el);
      } else {
        walk(el);
      }
    }
  };
  walk(doc.documentElement);
  return {kind: 'html', html: '<div class="hw">' + outA.join('') + '</div>', paper: hasStyle,
    note: '한글(hwpx) · ' + nRowsSeen + '행 × ' + nColsSeen + '열' + (merged ? ' · 병합 ' + merged + '개' : '')};
}

/* ---------- DOCX (워드 · mammoth 없이 word/document.xml 직접 해석) ---------- */
async function openDocx(buf){
  const z = await readZip(buf);
  const doc = z.names.find(n => /^word\/document\.xml$/.test(n));
  if (!doc) throw new Error('워드 본문(word/document.xml)을 찾지 못했습니다');
  const xml = await z.get(doc);
  const dm = xmlParse(xml);
  const local = el => (el.localName || el.tagName.replace(/^.*:/, ''));
  const kids = el => [...el.children];
  const txtOf = el => [...el.getElementsByTagName('*')].filter(x => local(x) === 't').map(x => x.textContent).join('');
  let html = '<div class="hw">';
  let nTab = 0, nPar = 0;
  const walk = node => {
    for (const el of kids(node)){
      const tag = local(el);
      if (tag === 'p'){
        const t = txtOf(el).trim();
        if (t){ html += '<p>' + esc(t) + '</p>'; nPar++; }
      } else if (tag === 'tbl'){
        let rows = [...el.getElementsByTagName('*')].filter(x => local(x) === 'tr');
        html += '<table class="xl">';
        for (const tr of rows){
          html += '<tr>';
          for (const tc of kids(tr)){
            if (local(tc) !== 'tc') continue;
            html += '<td>' + esc(txtOf(tc).trim()) + '</td>';
          }
          html += '</tr>';
        }
        html += '</table>';
        nTab++;
      } else if (tag === 'body' || tag === 'sdt' || tag === 'sectPr'){
        walk(el);
      }
    }
  };
  walk(dm.documentElement);
  html += '</div>';
  return {kind:'html', html, note:'워드(docx) · 문단 ' + nPar + '개' + (nTab ? ' · 표 ' + nTab + '개' : '')};
}

/* ---------- 표 래핑 + 확대/축소 + 전체 폭 맞춤 (줄바꿈 없이 글자만 축소) ---------- */
let fitOn = false, userZoom = 1;
function maxCols(tables){
  let cols = 0;
  tables.forEach(t => {
    for (const tr of t.rows){
      let n = 0;
      for (const cell of tr.cells) n += (cell.colSpan || 1);
      cols = Math.max(cols, n);
    }
  });
  return cols;
}
function applyTableZoom(){
  document.querySelectorAll('.xlwrap').forEach(w => {
    const sc = w.querySelector('.xlscale'); if (!sc) return;
    const tbl = sc.querySelector('table'); if (!tbl) return;
    tbl.style.transform = 'none';
    const nat = tbl.scrollWidth || tbl.offsetWidth || 1;
    const box = w.clientWidth || nat;
    let k = fitOn ? Math.min(1.6, box / nat) : userZoom;
    if (!isFinite(k) || k <= 0) k = 1;
    sc.style.transform = 'scale(' + k.toFixed(3) + ')';
    sc.style.width = nat + 'px';
    /* 스케일 후 실제 차지 높이를 잡아 빈 공간·겹침을 없앤다 */
    const h = tbl.offsetHeight * k;
    w.style.height = (fitOn ? Math.max(h, 0) : Math.max(tbl.offsetHeight, 0)) + 'px';
    w.style.overflowX = fitOn ? 'hidden' : 'auto';
    const pct = w.parentNode.querySelector('.zoombox .pct');
    if (pct) pct.textContent = Math.round(k * 100) + '%';
  });
}
function wrapTables(){
  const tables = [...out.querySelectorAll('table.xl')];
  if (!tables.length) return null;
  const cols = maxCols(tables);
  const wraps = [];
  tables.forEach(t => {
    if (t.parentNode && t.parentNode.classList && t.parentNode.classList.contains('xlscale')){
      wraps.push(t.parentNode.parentNode); return;
    }
    const sc = document.createElement('div');
    sc.className = 'xlscale';
    const w = document.createElement('div');
    w.className = 'xlwrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(sc); sc.appendChild(t);
    wraps.push(w);
  });
  if (!document.getElementById('fitBtn')){
    const bar = document.createElement('div');
    bar.className = 'xltop';
    bar.innerHTML = '<span>표 ' + tables.length + '개' + (cols ? ' · ' + cols + '열' : '') + '</span>'
      + '<span class="sp2"></span>'
      + '<div class="zoombox"><button type="button" id="zOut">축소</button><span class="pct">100%</span>'
      + '<button type="button" id="zIn">확대</button>'
      + '<button class="fitbtn" id="fitBtn">전체 폭 맞춤</button></div>';
    const host = out.querySelector('.hw') || out;
    host.insertBefore(bar, host.firstChild);
    const swipe = document.createElement('div');
    swipe.className = 'hint-swipe';
    swipe.textContent = '← 옆으로 밀면 오른쪽 열까지 보입니다 · 칸이 좁으면 글자가 자동으로 줄어듭니다';
    host.insertBefore(swipe, host.children[1] || null);
    document.getElementById('zOut').onclick = () => {
      userZoom = Math.max(0.5, +(userZoom - 0.1).toFixed(2)); fitOn = false;
      document.getElementById('fitBtn').classList.remove('on'); applyTableZoom();
    };
    document.getElementById('zIn').onclick = () => {
      userZoom = Math.min(2, +(userZoom + 0.1).toFixed(2));
      applyTableZoom();
    };
    document.getElementById('fitBtn').onclick = () => {
      fitOn = !fitOn;
      document.getElementById('fitBtn').classList.toggle('on', fitOn);
      applyTableZoom();
      showToast(fitOn ? '전체 폭 맞춤 · 글자만 줄여 한 화면에' : '원래 크기 · 옆으로 밀어 보기');
    };
  }
  setTimeout(applyTableZoom, 30);
  return cols;
}
window.addEventListener('resize', () => applyTableZoom());
let toastT;
function showToast(m){
  let t = document.querySelector('.toast');
  if (!t){ t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
}

/* ---------- PDF (PDF.js 캔버스 직접 렌더) ---------- */
let PDFSTATE = {doc: null, zoom: 1};
async function openPdf(file){
  if (typeof pdfjsLib === 'undefined'){
    const url = URL.createObjectURL(file);
    out.innerHTML = `<p style="font-size:12.5px;color:#B45309">PDF 표시 도구를 불러오지 못해 기본 열기로 대체합니다.</p><iframe class="pdf" src="${url}"></iframe>`;
    return;
  }
  out.innerHTML = '<p style="color:#64748B;font-size:13px">PDF 페이지를 그리는 중…</p>';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  PDFSTATE.doc = pdf; PDFSTATE.zoom = 1;
  await renderPdf();
}
async function renderPdf(){
  const pdf = PDFSTATE.doc; if (!pdf) return;
  const cw = Math.min(document.getElementById('out').clientWidth - 2, 860);
  let html = `<div class="pdftop"><b>${pdf.numPages}페이지</b><span>전체 페이지를 그 자리에서 그립니다</span>
    <div class="btnz"><button onclick="setZoom(-1)" id="zm">−</button><button onclick="setZoom(1)" id="zp">+</button></div></div><div id="pdfpages" class="pdfpgwrap"></div>`;
  out.innerHTML = html;
  const host = document.getElementById('pdfpages');
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const base = page.getViewport({scale: 1});
    const scale = (cw * PDFSTATE.zoom) / base.width * dpr;
    const vp = page.getViewport({scale});
    const cv = document.createElement('canvas');
    cv.className = 'pdfpg';
    cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    cv.style.width = '100%';
    const wrap = document.createElement('div');
    wrap.style.position = 'relative';
    wrap.appendChild(cv);
    const tag = document.createElement('span'); tag.className = 'pdfno'; tag.textContent = p + ' / ' + pdf.numPages;
    wrap.appendChild(tag);
    host.appendChild(wrap);
    try{
      await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    }catch(e){ console.warn('page render fail', p, e); }
  }
}
function setZoom(d){
  PDFSTATE.zoom = Math.max(0.6, Math.min(2.4, PDFSTATE.zoom + d * 0.2));
  renderPdf();
}

/* ---------- CSV / TXT ---------- */
function openText(txt, name){
  if (/\.csv$/i.test(name)){
    const rows = txt.split(/\r?\n/).filter(r => r.length).map(r => r.split(','));
    let html = '<table class="xl">';
    rows.forEach((r, i) => { html += '<tr>' + r.map(c => `<${i === 0 ? 'th' : 'td'}>${esc(c)}</${i === 0 ? 'th' : 'td'}>`).join('') + '</tr>'; });
    return {kind: 'table', html: html + '</table>', note: 'CSV · ' + rows.length + '행'};
  }
  return {kind: 'html', html: '<div class="hw">' + txt.split(/\n{2,}/).map(p => '<p>' + esc(p) + '</p>').join('') + '</div>', note: '텍스트'};
}

/* ---------- 라우팅 ---------- */
const out = document.getElementById('out'), docEl = document.getElementById('doc');
const dropEl = document.getElementById('drop'), loaderEl = document.getElementById('loader');
function loader(on, name, step, pct){
  loaderEl.classList.toggle('on', !!on);
  if (name != null) document.getElementById('lName').textContent = name;
  if (step != null) document.getElementById('lStep').textContent = step;
  if (pct != null) document.getElementById('lBar').style.width = Math.max(8, Math.min(100, pct)) + '%';
}
function resetView(){
  docEl.style.display = 'none'; docEl.classList.remove('paper');
  document.getElementById('banner').classList.remove('hide');
  dropEl.classList.remove('mini'); loaderEl.classList.remove('on');
  out.innerHTML = ''; document.getElementById('f').value = '';
  if (location.search) history.replaceState(null, '', location.pathname);
  window.scrollTo(0, 0);
}
document.getElementById('backb').onclick = resetView;

async function showFile(file){
  const nm = file.name || '문서';
  dropEl.classList.add('mini');
  document.getElementById('mName').textContent = nm;
  document.getElementById('mMeta').textContent = Math.round(file.size / 1024) + 'KB';
  docEl.style.display = 'none';
  window.scrollTo(0, 0);
  loader(true, nm, '파일을 여는 중…', 22);
  const name = nm.toLowerCase();
  try{
    let r = null;
    if (/\.(jpe?g|png|gif|webp|bmp)$/.test(name)){
      const url = URL.createObjectURL(file);
      r = {kind: 'img', html: `<img class="pic" src="${url}" alt="이미지">`, note: '사진'}
    } else if (/\.pdf$/.test(name)){
      loader(true, nm, 'PDF 페이지를 그리는 중…', 55);
      docEl.style.display = 'block';
      document.getElementById('fname').textContent = nm;
      document.getElementById('fmeta').textContent = Math.round(file.size / 1024) + 'KB · PDF';
      await openPdf(file);
      loader(false); window.scrollTo(0, 0); return;
    } else if (/\.(xlsx|xlsm)$/.test(name)){
      loader(true, nm, '엑셀 표를 읽는 중…', 48);
      r = await openXlsx(await file.arrayBuffer());
    } else if (/\.docx$/.test(name)){
      loader(true, nm, '워드 문서를 읽는 중…', 48);
      r = await openDocx(await file.arrayBuffer());
    } else if (/\.hwpx$/.test(name)){
      loader(true, nm, '한글 문서를 읽는 중…', 48);
      r = await openHwpx(await file.arrayBuffer());
    } else if (/\.(csv|txt)$/.test(name)){
      r = openText(await file.text(), name);
    } else if (/\.hwp$/.test(name)){
      r = {kind: 'html', html: '<div class="hw"><p>구형 .hwp(바이너리) 형식은 브라우저에서 직접 해석할 수 없습니다.</p><p>한글에서 <b>.hwpx</b>로 저장하거나 PDF로 내보내면 바로 열립니다. 변환이 필요하시면 원클릭에서 문의해 주세요.</p></div>', note: '구형 한글'}
    } else {
      r = {kind: 'html', html: '<div class="hw"><p>지원하지 않는 형식입니다. 한글(.hwp/.hwpx)·엑셀(.xlsx)·워드(.docx)·PDF·사진·텍스트를 지원합니다.</p></div>', note: ''}
    }
    loader(true, nm, '화면을 정리하는 중…', 92);
    out.innerHTML = r.html;
    document.getElementById('fname').textContent = nm;
    document.getElementById('fmeta').textContent = Math.round(file.size / 1024) + 'KB' + (r.note ? ' · ' + r.note : '');
    docEl.classList.toggle('paper', !!r.paper);
    if (r.kind !== 'pdf'){ try{ wrapTables(); }catch(e){} }
    docEl.style.display = 'block';
    document.getElementById('banner').classList.add('hide');
    loader(false);
    window.scrollTo(0, 0);
  }catch(err){
    loader(false);
    docEl.style.display = 'block';
    out.innerHTML = '<div class="hw"><p>파일을 여는 중 문제가 생겼습니다: ' + esc(err.message || String(err)) + '</p></div>';
  }
}
document.getElementById('f').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  showFile(file);
});

/* 제미나이 변환기에서 넘어온 파일 열기(?f=IndexedDB키&n=이름) */
(async function(){
  const q = new URLSearchParams(location.search);
  const id = q.get('f'); if (!id) return;
  loader(true, q.get('n') || '변환한 파일', '변환한 파일을 여는 중…', 30);
  try{
    const rec = await new Promise((res, rej) => {
      const rq = indexedDB.open('kts', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('files');
      rq.onerror = () => rej(rq.error);
      rq.onsuccess = () => {
        const tx = rq.result.transaction('files', 'readonly');
        const g = tx.objectStore('files').get(id);
        g.onsuccess = () => res(g.result);
        g.onerror = () => rej(g.error);
      };
    });
    if (!rec || !rec.blob) throw new Error('파일을 찾지 못했습니다');
    const f = new File([rec.blob], rec.name || 'KTS_변환문서.hwpx', {type: rec.blob.type || ''});
    await showFile(f);
  }catch(e){
    loader(false);
    showToast('변환한 파일을 여는 데 실패했습니다. 파일을 저장한 뒤 [파일 열기]로 열어 주세요.');
  }
})();

<!-- ===== (추가) 앱(더뷰 APK) 연동 규약 — 파일 받기·준비 신호·돌아가기·더편집 ===== -->
<script>
(function(){
  /* ① 앱이 넘긴 파일을 받는 창구 : MainActivity 의 window.__KTS_OPEN(name, path, base64) */
  function b64ToBlob(b64){
    var bin = atob(b64), len = bin.length, arr = new Uint8Array(len);
    for (var i = 0; i < len; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type: 'application/octet-stream'});
  }
  window.__KTS_OPEN = function(name, path, b64){
    try{
      var blob = b64ToBlob(b64);
      var f = new File([blob], name || 'document', {type: blob.type || ''});
      if (typeof showFile === 'function') showFile(f);
      else if (window.showFile) window.showFile(f);
      else if (typeof showToast === 'function') showToast('파일을 열 수 없습니다');
    }catch(e){
      if (typeof showToast === 'function') showToast('파일을 읽지 못했습니다: ' + e.message);
    }
  };

  /* ② 페이지가 준비됐다는 신호 — 로드 전에 넘어온 파일이 유실되지 않게 */
  function signal(){
    try{ if (window.KTSApp && typeof KTSApp.ready === 'function') KTSApp.ready(); }catch(e){}
  }
  if (document.readyState === 'complete') signal();
  else window.addEventListener('load', signal);

  /* ③ 앱 안에서는 헤더를 '← 돌아가기'로 — 앱 안에 쇼룸을 쌓지 않는다 */
  function inApp(){
    try{ if (window.KTSApp) return true; }catch(e){}
    return /KTS[\s\S]*더뷰/.test(navigator.userAgent);
  }
  function openHome(){
    try{ if (window.KTSApp && typeof KTSApp.openHome === 'function'){ KTSApp.openHome(); return; } }catch(e){}
    location.href = 'https://autooneclick.com/?from=viewer';
  }
  if (inApp()){
    var a = document.querySelector('header a[href="index.html"]');
    if (a){
      a.textContent = '← 돌아가기';
      a.addEventListener('click', function(ev){
        ev.preventDefault();
        var d = document.getElementById('doc');
        if (d && d.style.display !== 'none' && typeof resetView === 'function'){ resetView(); return; }
        openHome();
      });
    }
    var up = document.getElementById('kipUpg');
    if (up) up.addEventListener('click', function(ev){ ev.preventDefault(); openHome(); });
  }

  /* ④ 더편집(서명·도장·글자 수정) — 아직 도구가 없으면 빈 화면 대신 '준비 중 · 알림 받기' */
  var ed = document.getElementById('kipEdit');
  if (ed) ed.addEventListener('click', function(){
    if (typeof showToast === 'function') showToast('더편집은 준비 중입니다 · 문자로 알려 드릴게요');
    setTimeout(function(){
      location.href = 'sms:01020022899?&body=' + encodeURIComponent('[원클릭] 더편집(글자·표·서명 수정) 준비되면 알려주세요');
    }, 600);
  });
})();
</script>
