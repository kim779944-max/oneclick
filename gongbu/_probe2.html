<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>gongbu probe2</title>
<style>body{font:12px/1.5 monospace;white-space:pre-wrap;background:#111;color:#eee;padding:8px}</style>
</head><body>
<pre id="o">running…</pre>
<script>
var K='0C4AD93D-75D2-447B-B533-C5ADDD4A5B2F';
var PNU='4182034525201020000';
var o=document.getElementById('o'), L=[];
function log(s){L.push(s);o.textContent=L.join('\n')}
function jsonp(url,ms){
  return new Promise(function(res){
    var cb='__p'+Math.floor(Math.random()*1e7), s=document.createElement('script'), done=false;
    function fin(v){ if(done)return; done=true; try{delete window[cb]}catch(e){window[cb]=null} if(s.parentNode)s.parentNode.removeChild(s); res(v) }
    var tm=setTimeout(function(){fin({__err:'timeout'})},ms||12000);
    window[cb]=function(d){clearTimeout(tm);fin(d)};
    s.onerror=function(){clearTimeout(tm);fin({__err:'onerror'})};
    s.src=url+'&callback='+cb;
    document.head.appendChild(s);
  });
}
function keys(o){ return o&&typeof o==='object'?Object.keys(o):[] }
function flat(rec,pre){ var out=[]; for(var k in rec){ if(rec[k]===null||rec[k]==='')continue; out.push((pre||'')+k+'='+String(rec[k]).slice(0,60)) } return out.join(' | ') }
var ned='https://api.vworld.kr/ned/data/';
(async function(){
  var r;
  r=await jsonp(ned+'ladfrlList?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=3&pageNo=1');
  log('== ladfrlList(토지임야정보) =='); log('topKeys: '+keys(r).join(','));
  try{ var vo=r.ladfrlVOList; log('subKeys: '+keys(vo).join(',')); var it=(vo.ladfrlVOList||vo.field||[]); log('rows='+it.length);
       if(it[0]){ log('fields: '+keys(it[0]).join(',')); log('row0: '+flat(it[0])) } }catch(e){ log('parse: '+e.message) }

  r=await jsonp(ned+'getLandCharacteristics?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=20&pageNo=1');
  log(''); log('== getLandCharacteristics(토지특성) =='); log('topKeys: '+keys(r).join(','));
  try{ var lc=r.landCharacteristicss; log('subKeys: '+keys(lc).join(',')); var f=lc.field||[]; log('rows='+f.length);
       if(f[0]){ log('fields: '+keys(f[0]).join(',')); for(var i=0;i<f.length && i<3;i++) log('row'+i+': '+flat(f[i])) } }catch(e){ log('parse: '+e.message) }

  r=await jsonp(ned+'getLandCharacteristics?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=20&pageNo=1&stdrYear=2026');
  log(''); log('== getLandCharacteristics stdrYear=2026 ==');
  try{ var f2=(r.landCharacteristicss&&r.landCharacteristicss.field)||[]; log('rows='+f2.length); if(f2[0])log('row0: '+flat(f2[0])) }catch(e){log('parse err')}

  r=await jsonp(ned+'getIndvdLandPriceAttr?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=10&pageNo=1');
  log(''); log('== getIndvdLandPriceAttr(개별공시지가) =='); log('topKeys: '+keys(r).join(','));
  try{ var p=r.indvdLandPrices; log('subKeys: '+keys(p).join(',')); var pf=p.field||[]; log('rows='+pf.length);
       if(pf[0]){ log('fields: '+keys(pf[0]).join(',')); for(var j=0;j<pf.length&&j<3;j++) log('row'+j+': '+flat(pf[j])) } }catch(e){ log('parse: '+e.message) }

  r=await jsonp(ned+'getLandUseAttr?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=200&pageNo=1');
  log(''); log('== getLandUseAttr(토지이용계획) =='); log('topKeys: '+keys(r).join(','));
  try{ var u=r.landUses; log('subKeys: '+keys(u).join(',')); var uf=u.field||[]; log('rows='+uf.length);
       if(uf[0]) log('fields: '+keys(uf[0]).join(','));
       for(var k=0;k<uf.length;k++) log('  ['+uf[k].cnflcAtNm+'] '+uf[k].prposAreaDstrcCodeNm+' ('+uf[k].prposAreaDstrcCode+')'); }catch(e){ log('parse: '+e.message) }

  /* 지적도 범위 조회 변형 */
  var base='https://api.vworld.kr/req/data?service=data&request=GetFeature&version=2.0&data=LP_PA_CBND_BUBUN&key='+K+'&domain=autooneclick.com&format=json&geometry=true&attribute=true&crs=EPSG:4326';
  var tests=[
    ['box-noSpace',base+'&size=50&page=1&box=127.3650,37.8300,127.3690,37.8340'],
    ['box-space',base+'&size=50&page=1&box='+encodeURIComponent('127.3650,37.8300,127.3690,37.8340')],
    ['buffer-point',base+'&size=50&page=1&buffer=150&geomFilter='+encodeURIComponent('POINT(127.3668 37.8319)')],
    ['geomFilter-BOX',base+'&size=50&page=1&geomFilter='+encodeURIComponent('BOX(127.3650,37.8300,127.3690,37.8340)')],
    ['attrFilter-jibun',base+'&size=5&page=1&attrFilter=jibun:like:102&geomFilter='+encodeURIComponent('POINT(127.3668 37.8319)')]
  ];
  for(var t=0;t<tests.length;t++){
    var rr=await jsonp(tests[t][1],8000);
    log(''); log('== 지적 '+tests[t][0]+' ==');
    if(rr.__err){ log('ERR '+rr.__err); continue }
    try{
      var rs=rr.response; log('status='+rs.status+' total='+(rs.record&&rs.record.total));
      var ft=rs.result&&rs.result.featureCollection&&rs.result.featureCollection.features||[];
      log('features='+ft.length);
      if(ft[0]){ log('props: '+flat(ft[0].properties)); log('geomType='+(ft[0].geometry&&ft[0].geometry.type)) }
    }catch(e){ log('parse: '+e.message) }
  }

  /* 건물 레이어 존재 확인(LT_C_SPBD) */
  r=await jsonp('https://api.vworld.kr/req/data?service=data&request=GetFeature&version=2.0&data=LT_C_SPBD&key='+K+'&domain=autooneclick.com&format=json&geometry=false&attribute=true&crs=EPSG:4326&size=5&page=1&geomFilter='+encodeURIComponent('POINT(127.3668 37.8319)'),8000);
  log(''); log('== LT_C_SPBD(건물) ==');
  if(r.__err) log('ERR '+r.__err); else { try{ var f3=(r.response.result.featureCollection.features)||[]; log('status='+r.response.status+' features='+f3.length); if(f3[0])log('props: '+flat(f3[0].properties)) }catch(e){ log('resp: '+JSON.stringify(r).slice(0,300)) } }

  /* 용도지역 폴리곤 레이어 */
  r=await jsonp('https://api.vworld.kr/req/data?service=data&request=GetFeature&version=2.0&data=LT_C_UQ111&key='+K+'&domain=autooneclick.com&format=json&geometry=true&attribute=true&crs=EPSG:4326&size=5&page=1&geomFilter='+encodeURIComponent('POINT(127.3668 37.8319)'),8000);
  log(''); log('== LT_C_UQ111(용도지역) ==');
  if(r.__err) log('ERR '+r.__err); else { try{ var f4=(r.response.result.featureCollection.features)||[]; log('status='+r.response.status+' features='+f4.length); if(f4[0])log('props: '+flat(f4[0].properties)) }catch(e){ log('resp: '+JSON.stringify(r).slice(0,300)) } }

  log(''); log('DONE2');
})();
</script>
</body></html>
