<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>gongbu probe</title>
<style>body{font:12px/1.5 monospace;white-space:pre-wrap;background:#111;color:#eee;padding:8px}</style>

<pre id="o">running…</pre>
<script>
var K='0C4AD93D-75D2-447B-B533-C5ADDD4A5B2F';
var PNU='4182034525201020000';
var o=document.getElementById('o'), L=[];
function log(s){L.push(s);o.textContent=L.join('\n')}
function jsonp(url){
  return new Promise(function(res){
    var cb='__p'+Math.floor(Math.random()*1e7), s=document.createElement('script'), done=false;
    function fin(v){ if(done)return; done=true; try{delete window[cb]}catch(e){window[cb]=null} if(s.parentNode)s.parentNode.removeChild(s); res(v) }
    var tm=setTimeout(function(){fin({__err:'jsonp-timeout'})},9000);
    window[cb]=function(d){clearTimeout(tm);fin({__ok:d})};
    s.onerror=function(){clearTimeout(tm);fin({__err:'jsonp-onerror'})};
    s.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb;
    document.head.appendChild(s);
  });
}
function head(v,n){ try{ if(typeof v==='string') return v.slice(0,n||200); return JSON.stringify(v).slice(0,n||200) }catch(e){ return String(v) } }
async function tfetch(url){
  var c=new AbortController(), tm=setTimeout(function(){c.abort()},15000);
  try{ var r=await fetch(url,{signal:c.signal}); var t=await r.text(); return {ok:r.ok,status:r.status,body:t} }
  catch(e){ return {err:e.name+' '+String(e.message).slice(0,80)} }
  finally{ clearTimeout(tm) }
}
async function test(name,url,useJsonp){
  var r=useJsonp?await jsonp(url):await tfetch(url);
  var line;
  if(r.__err) line='ERR '+r.__err;
  else if(r.__ok!==undefined) line='JSONP '+head(r.__ok,220);
  else if(r.err) line='FETCH-ERR '+r.err;
  else line='HTTP '+r.status+' '+head(r.body,220);
  log(name+' :: '+line);
}
(async function(){
  log('origin='+location.origin);
  await test('A1 addr-jsonp','https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0&crs=EPSG:4326&format=json&type=parcel&key='+K+'&domain=autooneclick.com&address='+encodeURIComponent('경기도 가평군 조종면 신하리 162-9'),1);
  await test('A2 addr-fetch','https://api.vworld.kr/req/address?service=address&request=getcoord&version=2.0&crs=EPSG:4326&format=json&type=parcel&key='+K+'&domain=autooneclick.com&address='+encodeURIComponent('경기도 가평군 조종면 신하리 162-9'));
  var g='https://api.vworld.kr/req/data?service=data&request=GetFeature&version=2.0&data=LP_PA_CBND_BUBUN&key='+K+'&domain=autooneclick.com&format=json&size=3&page=1&geometry=true&attribute=true&crs=EPSG:4326';
  await test('B1 parcel-jsonp',g+'&geomFilter='+encodeURIComponent('POINT(127.3668 37.8319)'),1);
  await test('B2 parcel-bbox-jsonp',g+'&box='+encodeURIComponent('127.3600,37.8250,127.3750,37.8400'),1);
  await test('B3 parcel-fetch',g+'&geomFilter='+encodeURIComponent('POINT(127.3668 37.8319)'));
  var ned='https://api.vworld.kr/ned/data/';
  await test('C1 landchar-fetch',ned+'getLandCharacteristics?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=5&pageNo=1');
  await test('C2 landchar-jsonp',ned+'getLandCharacteristics?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=5&pageNo=1',1);
  await test('C3 landchar-xml-jsonp',ned+'getLandCharacteristics?key='+K+'&domain=autooneclick.com&format=xml&pnu='+PNU+'&numOfRows=5&pageNo=1',1);
  await test('D1 ladfrl-fetch',ned+'ladfrlList?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=5&pageNo=1');
  await test('D2 ladfrl-jsonp',ned+'ladfrlList?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=5&pageNo=1',1);
  await test('E1 landuse-fetch',ned+'getLandUseAttr?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=50&pageNo=1');
  await test('E2 landuse-jsonp',ned+'getLandUseAttr?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=50&pageNo=1',1);
  await test('F1 price-fetch',ned+'getIndvdLandPriceAttr?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=5&pageNo=1');
  await test('F2 price-jsonp',ned+'getIndvdLandPriceAttr?key='+K+'&domain=autooneclick.com&format=json&pnu='+PNU+'&numOfRows=5&pageNo=1',1);
  await test('G1 bldrgst-fetch-nokey','https://apis.data.go.kr/1613000/BldRgstHubService/getBrBasisOulnInfo?serviceKey=probe&sigunguCd=41820&bjdongCd=34525&platGbCd=1&bun=0162&ji=0009&_type=json&numOfRows=5&pageNo=1');
  await test('G2 bldrgst-title-nokey','https://apis.data.go.kr/1613000/BldRgstHubService/getBrTitleInfo?serviceKey=probe&sigunguCd=41820&bjdongCd=34525&platGbCd=1&bun=0162&ji=0009&_type=json&numOfRows=5&pageNo=1');
  await test('H1 vw-tile-fetch','https://api.vworld.kr/req/wmts/1.0.0/'+K+'/Base/16/25619/55808.png');
  await test('H2 vw-sat-fetch','https://api.vworld.kr/req/wmts/1.0.0/'+K+'/Satellite/16/25619/55808.jpeg');
  await test('H3 carto-fetch','https://basemaps.cartocdn.com/dark_all/16/55808/25619.png');
  await test('H4 esri-sat-fetch','https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/16/25619/55808');
  /* 이미지로 넣어 캔버스가 더러워지는지(canvas taint) 확인 */
  function imgTest(name,url){
    return new Promise(function(res){
      var im=new Image(); im.crossOrigin='anonymous';
      im.onload=function(){
        try{ var c=document.createElement('canvas'); c.width=im.width; c.height=im.height;
          var x=c.getContext('2d'); x.drawImage(im,0,0);
          try{ c.toDataURL('image/png'); log(name+' :: IMG-CORS-OK '+(im.width+'x'+im.height)) }
          catch(e){ log(name+' :: IMG-TAINT') }
        }catch(e){ log(name+' :: IMG-ERR '+e.message) }
        res();
      };
      im.onerror=function(){ log(name+' :: IMG-ERR load-fail'); res() };
      im.src=url;
    });
  }
  await imgTest('I1 vw-tile-img','https://api.vworld.kr/req/wmts/1.0.0/'+K+'/Base/16/25619/55808.png');
  await imgTest('I2 vw-sat-img','https://api.vworld.kr/req/wmts/1.0.0/'+K+'/Satellite/16/25619/55808.jpeg');
  await imgTest('I3 carto-img','https://basemaps.cartocdn.com/dark_all/16/55808/25619.png');
  await imgTest('I4 esri-sat-img','https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/16/25619/55808');
  log('DONE');
})();
</script>
