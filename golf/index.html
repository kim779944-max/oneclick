<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1128">
<title>골프 스윙 교정 내비게이션 — 훅·슬라이스·캐스팅·머리 고정</title>
<meta name="description" content="훅·슬라이스·캐스팅·머리 들림의 원인을 하나씩 짚고, 손목·손동작·머리·어깨 고정 그림과 함께 1→2→3단계 응급처방으로 안 될 때까지 길을 다시 찾아 드립니다.">
<link rel="icon" href="../icon.png">
<style>
:root{--bg:#0A1128;--bg2:#0A1224;--card:#0F1B33;--card2:#12203C;--line:#26375F;--line2:#2E4370;
--ink:#F3F6FA;--ink2:#AFBDD0;--gray:#8FA0B8;--or:#FF6B00;--or2:#FFA24D;--on:#0A1224;
--ok:#4ADE80;--red:#FF5C6C;--warn:#FCD34D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.55;padding-bottom:74px;-webkit-text-size-adjust:100%}
a{color:var(--or2)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.hd{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:8px;height:54px}
.hd .back{color:var(--ink2);text-decoration:none;font-size:13px;padding:8px 0;white-space:nowrap}
.hd h1{flex:1;min-width:0;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h1 small{display:block;font-size:11px;color:var(--gray);font-weight:400}
.hero{margin:12px 0 0;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(255,107,0,.14),rgba(255,255,255,.02) 65%)}
.hero b{display:block;font-size:15.5px;margin-bottom:4px;letter-spacing:-.3px}
.hero span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.card h2 .n{display:inline-flex;width:22px;height:22px;border-radius:11px;background:var(--or);color:var(--on);font-size:12px;align-items:center;justify-content:center;font-weight:800}
.syms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sym{display:block;text-align:left;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;color:var(--ink);font-family:inherit;font-size:13.5px;cursor:pointer;line-height:1.35}
.sym:active{border-color:var(--or)}
.sym b{display:block;font-size:14px;margin-bottom:2px}
.sym span{display:block;font-size:11px;color:var(--gray)}
.crumb{display:flex;gap:5px;flex-wrap:wrap;font-size:11.5px;color:var(--gray);margin:0 0 8px}
.crumb i{font-style:normal;color:var(--or2)}
.stepbar{display:flex;gap:4px;margin:0 0 10px}
.stepbar div{flex:1;height:5px;border-radius:3px;background:var(--line2)}
.stepbar div.on{background:var(--or)}
.fig{background:#0B1526;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:0 0 4px}
.fig svg{display:block;width:100%;height:auto}
.cap{font-size:11.5px;color:var(--gray);margin:5px 2px 0;line-height:1.55}
.cause{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:0 0 10px;font-size:13.5px;line-height:1.6}
.cause b{color:var(--or2)}
.stepno{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--gray);margin:0 0 6px}
.stepno b{font-size:11px;color:var(--on);background:var(--or);border-radius:6px;padding:1px 7px;font-weight:800}
.stitle{font-size:18px;font-weight:900;letter-spacing:-.4px;margin:0 0 4px;line-height:1.35;word-break:keep-all}
.slead{font-size:13px;color:var(--ink2);margin:0 0 10px;line-height:1.6}
.kv{border-top:1px solid var(--line);padding:9px 0 0;margin:9px 0 0}
.kv b{display:block;font-size:11.5px;color:var(--or2);font-weight:800;margin-bottom:3px;letter-spacing:.2px}
.kv p{margin:0;font-size:13.5px;line-height:1.65;color:#E4EBF5;word-break:keep-all}
.kv ul{margin:0;padding-left:17px;font-size:13.5px;line-height:1.68;color:#E4EBF5}
.kv li{margin:0 0 4px}
.kv.no b{color:#FFB6C0}
.kv.ok b{color:#8BF0B4}
.tried{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0}
.tried span{font-size:11px;color:var(--gray);border:1px solid var(--line2);border-radius:999px;padding:2px 8px}
.nav{display:grid;grid-template-columns:1fr;gap:8px;margin:14px 0 6px}
.nav .btn{min-height:50px;font-size:15px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 13px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-family:inherit;font-size:13.5px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--or);border-color:var(--or);color:var(--on);font-weight:900}
.btn.big{min-height:52px;font-size:16px}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;font-size:12.5px;padding:0 9px}
.reroute{background:#2a1a08;border:1px solid var(--or);border-radius:12px;padding:10px 12px;font-size:13px;color:#FFD79A;line-height:1.6;margin:0 0 10px}
.note{font-size:11.5px;color:var(--gray);line-height:1.6;margin:8px 0 0}
.warn{font-size:11.5px;color:var(--warn);line-height:1.6;margin:7px 0 0}
.graybox{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.graybox b{color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
.acts .btn{min-height:48px;font-size:14px;font-weight:800}
.acts .btn.pri{grid-column:1/-1}
.acts .wide{grid-column:1/-1}
.succ{font-size:20px;font-weight:900;letter-spacing:-.4px;margin:0 0 6px;color:#8BF0B4}
.drill{counter-reset:d;margin:0;padding:0;list-style:none}
.drill li{position:relative;padding:9px 0 9px 30px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6}
.drill li:first-child{border-top:0}
.drill li::before{counter-increment:d;content:counter(d);position:absolute;left:0;top:9px;width:20px;height:20px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);color:var(--or2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.sitebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,#1D4ED8,#15379B);border-top:1px solid #3B6BE8}
.sitebar a{display:flex;align-items:center;justify-content:center;gap:7px;height:46px;color:#fff;text-decoration:none;font-size:14px;font-weight:800}
.sitebar a i{font-style:normal;font-size:10.5px;font-weight:700;color:#C7D7FF;background:rgba(255,255,255,.14);border-radius:6px;padding:1px 6px}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:60;background:#1d2c4f;border:1px solid var(--or);border-radius:999px;padding:9px 15px;font-size:13.5px;max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media print{.sitebar,.nav,.acts{display:none}body{padding-bottom:0}}
</style>
</head>
<body>
<header class="hd"><div class="wrap">
  <a class="back" href="https://autooneclick.com/">← 쇼룸</a>
  <h1>골프 스윙 교정 내비<small>원인 → 그림 → 1·2·3 · 안 되면 재탐색</small></h1>
</div></header>

<main class="wrap">
  <div id="app"></div>
</main>

<footer class="sitebar"><a href="https://autooneclick.com/">autooneclick.com <i>원클릭 도구</i></a></footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);},$$=function(s){return [].slice.call(document.querySelectorAll(s));};
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2400);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function stamp(){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());}

/* =========================================================
   그림(SVG) — 손목·손동작·머리·어깨 고정 화살표
   ========================================================= */
var UID=0;
function S(w,h,build){
  UID++;
  var ar='ar'+UID,ag='ag'+UID,ared='rd'+UID,cl='#DCE6F6',ln='#8FA0B8';
  var defs='<defs>'+
    '<marker id="'+ar+'" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#FF6B00"/></marker>'+
    '<marker id="'+ag+'" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4ADE80"/></marker>'+
    '<marker id="'+ared+'" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#FF5C6C"/></marker>'+
    '</defs>';
  var body=build(ar,ag,ared,cl,ln);
  return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" role="img">'+defs+
    '<rect width="'+w+'" height="'+h+'" fill="#0B1526"/>'+body+'</svg>';
}
function txt(x,y,s,size,color,anchor,weight){
  return '<text x="'+x+'" y="'+y+'" font-size="'+(size||12)+'" font-family="Malgun Gothic,Noto Sans KR,sans-serif" fill="'+(color||'#AFBDD0')+'" text-anchor="'+(anchor||'start')+'" font-weight="'+(weight||600)+'">'+s+'</text>';
}
function arrow(id,d,color){
  return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="3.5" stroke-linecap="round" marker-end="url(#'+id+')"/>';
}
function panel(x,y,w,h,label,ok){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="#101E36" stroke="'+(ok?'#2d6b45':'#7a2f3a')+'" stroke-width="1.5"/>'+
    txt(x+12,y+22,label,11.5,ok?'#8BF0B4':'#FFB6C0','start',800);
}
/* 1. 손목 ㄱ자 유지 vs 풀림(캐스팅) */
function figWristHinge(){
  return S(360,250,function(ar,ag,ared,cl,ln){
    var s='';
    s+=panel(8,8,168,234,'유지 · 손목 ㄱ자',1);
    s+=panel(184,8,168,234,'풀림 · 캐스팅',0);
    // A: forearm + hand + shaft at 90°
    s+='<path d="M30,190 L96,156" stroke="'+cl+'" stroke-width="9" stroke-linecap="round"/>';
    s+='<circle cx="100" cy="153" r="8" fill="'+cl+'"/>';
    s+='<path d="M100,153 L74,80" stroke="#FFA24D" stroke-width="6" stroke-linecap="round"/>';
    s+='<path d="M100,153 L96,190" stroke="'+ln+'" stroke-width="2" stroke-dasharray="4 4"/>';
    s+='<path d="M92,153 A24 24 0 0 0 96,129" fill="none" stroke="#4ADE80" stroke-width="2.5"/>';
    s+='<path d="M86,146 L86,136 M86,136 L96,136" fill="none" stroke="#4ADE80" stroke-width="2.5"/>';
    s+=txt(120,124,'ㄱ자',10.5,'#8BF0B4');
    s+=txt(24,214,'왼손목을 접은 채',10.5,'#AFBDD0');
    s+=txt(24,228,'그립 끝이 하늘을 봄',10.5,'#8FA0B8');
    // B: wrist released — shaft continues forward/down
    s+='<path d="M206,190 L272,156" stroke="'+cl+'" stroke-width="9" stroke-linecap="round"/>';
    s+='<circle cx="276" cy="153" r="8" fill="'+cl+'"/>';
    s+='<path d="M276,153 L330,196" stroke="#FF5C6C" stroke-width="6" stroke-linecap="round"/>';
    s+=arrow(ar,'M286,120 C310,130 322,160 326,186','#FF6B00');
    s+=txt(240,110,'손이 먼저 풀림',10.5,'#FFB6C0');
    s+=txt(200,214,'헤드가 공보다 먼저',10.5,'#AFBDD0');
    s+=txt(200,228,'바닥을 향해 떨어짐',10.5,'#8FA0B8');
    return s;
  });
}
/* 2. 왼손등 방향(페이스) */
function figWristRoll(){
  return S(360,230,function(ar,ag,ared,cl,ln){
    var s='';
    s+=panel(8,8,168,214,'왼손등이 목표 · 정사각',1);
    s+=panel(184,8,168,214,'손목이 돌아 닫힘',0);
    // A: square face
    s+='<rect x="52" y="112" width="64" height="52" rx="6" fill="#1B2E52" stroke="'+cl+'" stroke-width="2.5"/>';
    s+='<rect x="79" y="58" width="11" height="54" rx="5" fill="#FFA24D"/>';
    s+=txt(84,192,'정사각',11,'#8BF0B4','middle',800);
    s+=arrow(ag,'M124,138 L166,138','#4ADE80');
    s+=txt(146,160,'목표',10,'#8BF0B4','middle');
    // B: closed face
    s+='<g transform="rotate(-24 272 138)">'+
       '<rect x="240" y="112" width="64" height="52" rx="6" fill="#2a2136" stroke="'+cl+'" stroke-width="2.5"/>'+
       '<rect x="267" y="58" width="11" height="54" rx="5" fill="#FFA24D"/></g>';
    s+='<path d="M246,140 A26 26 0 0 1 288,112" fill="none" stroke="#FF6B00" stroke-width="3" marker-end="url(#'+ar+')"/>';
    s+=txt(268,192,'닫힘 (왼쪽으로)',11,'#FFB6C0','middle',800);
    return s;
  });
}
/* 3. 클럽 경로(위에서 본 화살표) */
function figPath(kind){
  return S(360,250,function(ar,ag,ared,cl,ln){
    var s='';
    // target line
    s+='<path d="M180,236 L180,26" stroke="#2E4370" stroke-width="2" stroke-dasharray="6 6"/>';
    s+=txt(184,22,'목표',10.5,'#8FA0B8');
    // player shoulders (bottom arc)
    s+='<path d="M120,236 A60 34 0 0 1 240,236" fill="none" stroke="'+ln+'" stroke-width="3"/>';
    s+=txt(180,246,'어깨선',10,'#8FA0B8','middle');
    // ball
    s+='<circle cx="180" cy="176" r="7" fill="#F3F6FA"/>';
    s+=txt(196,180,'공',10.5,'#DCE6F6');
    if(kind==='hook'){
      s+=arrow(ar,'M242,214 C214,190 186,150 150,72','#FF6B00');
      s+=txt(248,224,'안쪽에서 들어와',10.5,'#FFD79A');
      s+=txt(58,66,'밖으로 나감',10.5,'#FFD79A');
      s+=arrow(ared,'M180,120 C160,104 140,96 118,96','#FF5C6C');
      s+=txt(120,116,'면이 닫혀 왼쪽으로',10.5,'#FFB6C0');
    }else if(kind==='slice'){
      s+=arrow(ar,'M118,214 C146,190 174,150 210,72','#FF6B00');
      s+=txt(28,224,'밖에서 들어와',10.5,'#FFD79A');
      s+=txt(212,66,'안쪽으로 감',10.5,'#FFD79A');
      s+=arrow(ared,'M180,120 C200,104 220,96 242,96','#FF5C6C');
      s+=txt(196,116,'면이 열려 오른쪽으로',10.5,'#FFB6C0');
    }else{
      s+=arrow(ag,'M180,214 C176,180 182,140 180,86','#4ADE80');
      s+=txt(196,140,'손은 목표선을 따라',10.5,'#8BF0B4');
    }
    return s;
  });
}
/* 4. 머리 고정(정면) */
function figHeadStill(){
  return S(360,250,function(ar,ag,ared,cl,ln){
    var s='';
    s+='<path d="M150,34 L150,220" stroke="#4ADE80" stroke-width="2.5" stroke-dasharray="7 6"/>';
    s+=txt(156,30,'머리 중심선',10.5,'#8BF0B4');
    // figure front view
    s+='<circle cx="150" cy="70" r="21" fill="none" stroke="'+cl+'" stroke-width="3.5"/>';
    s+='<path d="M150,91 L150,140" stroke="'+cl+'" stroke-width="4"/>';
    s+='<path d="M126,102 L174,102" stroke="'+cl+'" stroke-width="4" stroke-linecap="round"/>';
    s+='<path d="M150,140 L134,196 M150,140 L166,196" stroke="'+cl+'" stroke-width="4" stroke-linecap="round"/>';
    s+='<path d="M126,102 L170,140" stroke="#FFA24D" stroke-width="4" stroke-linecap="round"/>';
    s+='<path d="M170,140 L196,196" stroke="#FFA24D" stroke-width="4" stroke-linecap="round"/>';
    s+='<circle cx="198" cy="200" r="6" fill="#F3F6FA"/>';
    // fixed arrows both sides
    s+=arrow(ag,'M120,70 L138,70','#4ADE80');
    s+=arrow(ag,'M180,70 L162,70','#4ADE80');
    s+=txt(150,118,'좌우 3cm 이내',10.5,'#8BF0B4','middle');
    // B: head lift
    s+=panel(226,8,126,234,'머리 들림',0);
    s+='<path d="M250,34 L250,220" stroke="#4ADE80" stroke-width="2" stroke-dasharray="7 6" opacity=".45"/>';
    s+='<circle cx="292" cy="58" r="19" fill="none" stroke="'+cl+'" stroke-width="3.5"/>';
    s+='<path d="M292,77 L282,132" stroke="'+cl+'" stroke-width="4"/>';
    s+='<path d="M262,92 L300,84" stroke="'+cl+'" stroke-width="4" stroke-linecap="round"/>';
    s+='<path d="M282,132 L266,196 M282,132 L300,196" stroke="'+cl+'" stroke-width="4" stroke-linecap="round"/>';
    s+=arrow(ar,'M254,74 C266,60 280,54 288,56','#FF6B00');
    s+=txt(238,166,'공을 보려고',10.5,'#FFD79A');
    s+=txt(238,180,'상체가 일어남',10.5,'#FFD79A');
    s+=txt(238,214,'→ 토핑·뒤땅',10.5,'#FFB6C0');
    return s;
  });
}
/* 5. 어깨 회전(위에서) */
function figShoulderTurn(){
  return S(360,240,function(ar,ag,ared,cl,ln){
    var s='';
    s+='<circle cx="180" cy="130" r="62" fill="none" stroke="#243a63" stroke-width="2"/>';
    // hip line 30deg
    s+='<g transform="rotate(-30 180 130)"><path d="M132,152 L228,152" stroke="#6E80A3" stroke-width="7" stroke-linecap="round"/></g>';
    s+=txt(232,178,'골반 45°',10.5,'#8FA0B8');
    // shoulder line 0 -> 70
    s+='<path d="M118,104 L242,104" stroke="'+cl+'" stroke-width="9" stroke-linecap="round" opacity=".35"/>';
    s+='<g transform="rotate(-70 180 130)"><path d="M118,126 L242,126" stroke="'+cl+'" stroke-width="9" stroke-linecap="round"/></g>';
    s+=arrow(ar,'M240,96 A78 78 0 0 0 176,56','#FF6B00');
    s+=txt(86,60,'어깨 90°',11,'#FFD79A');
    s+=txt(180,224,'등이 목표 반대쪽을 보이면 어깨가 돈 것',10.5,'#8FA0B8','middle');
    return s;
  });
}
/* 6. 체중(발 압력) */
function figWeight(){
  return S(360,220,function(ar,ag,ared,cl,ln){
    var s='';
    // feet
    s+='<ellipse cx="120" cy="120" rx="42" ry="24" fill="#16284A" stroke="'+cl+'" stroke-width="2.5"/>';
    s+='<ellipse cx="240" cy="120" rx="42" ry="24" fill="#16284A" stroke="'+cl+'" stroke-width="2.5"/>';
    s+=txt(120,126,'왼발',11,'#F3F6FA','middle',800);
    s+=txt(240,126,'오른발',11,'#F3F6FA','middle',800);
    s+=arrow(ag,'M120,70 L120,104','#4ADE80');
    s+='<path d="M120,52 L120,66" stroke="#4ADE80" stroke-width="4" stroke-linecap="round"/>';
    s+=txt(120,44,'70%',12,'#8BF0B4','middle',800);
    s+=arrow(ar,'M240,70 L240,100','#FF6B00');
    s+=txt(240,44,'30%',12,'#FFD79A','middle',800);
    s+=txt(180,176,'임팩트 순간 왼발에 70%가 실려야',11,'#DCE6F6','middle');
    s+=txt(180,194,'헤드가 공을 눌러 내려갑니다',11,'#8FA0B8','middle');
    return s;
  });

var ST={sym:null,cause:0,step:0,tried:[],done:false,win:null,reroute:false};
function findSym(id){for(var i=0;i<SYM.length;i++)if(SYM[i].id===id)return SYM[i];return null;}

function screenPick(){
  var h='<div class="hero"><b>오늘 필드에서 뭐가 나왔습니까?</b><span>증상을 고르면 원인을 하나씩 짚고, 그림과 함께 1→2→3단계로 안내합니다. <b style="display:inline;color:var(--or2)">안 돼요</b>를 누르면 다음 경로로 다시 찾아갑니다.</span></div>';
  h+='<section class="card"><h2><span class="n">1</span>증상 고르기</h2><div class="syms">';
  SYM.forEach(function(s){
    h+='<button class="sym" data-sym="'+s.id+'" type="button"><b>'+s.name+'</b><span>'+s.short+'</span></button>';
  });
  h+='</div><p class="note">정확히 모르면 가장 많이 나오는 증상부터. 도중에 다른 증상으로 바꿀 수 있습니다.</p></section>';
  $('#app').innerHTML=h;
  $$('[data-sym]').forEach(function(b){b.addEventListener('click',function(){start(b.getAttribute('data-sym'));});});
}
function start(id){
  ST={sym:findSym(id),cause:0,step:0,tried:[],done:false,win:null,reroute:false};
  renderStep();
}
function renderStep(){
  var S1=ST.sym,c=S1.causes[ST.cause],st=c.steps[ST.step];
  var h='<div class="crumb">';
  h+='<span>'+esc(S1.name)+'</span><i>›</i><span>원인 '+(ST.cause+1)+'/'+S1.causes.length+'</span><i>›</i><span>'+esc(c.name)+'</span>';
  h+='</div>';
  h+='<div class="stepbar">';
  for(var i=0;i<c.steps.length;i++)h+='<div'+(i<=ST.step?' class="on"':'')+'></div>';
  h+='</div>';
  if(ST.reroute){
    h+='<div class="reroute"><b>경로를 재탐색했습니다.</b><br>앞의 방법으로 해결되지 않아 다른 원인으로 안내합니다 — <b>'+esc(c.name)+'</b></div>';
  }
  h+='<div class="cause"><b>원인 '+(ST.cause+1)+'</b> · '+esc(c.name)+'<br><span style="color:#AFBDD0;font-size:12.5px">'+c.why+'</span></div>';
  h+='<div class="stepno"><b>'+(ST.step+1)+'단계</b> '+esc(S1.name)+' 교정 · '+ST.step+'/'+(c.steps.length-1)+'</div>';
  h+='<div class="stitle">'+st.t+'</div>';
  h+='<div class="slead">'+esc(c.name)+' — 이 단계만 10~20회 해 보세요.</div>';
  h+='<div class="fig">'+(FIG[st.img]?FIG[st.img]():'')+'</div>';
  h+='<div class="cap">'+(st.img==='wristHinge'?'왼쪽처럼 손목 각(ㄱ자)을 유지하고, 오른쪽처럼 손이 먼저 풀리지 않게 합니다.':
    st.img==='wristRoll'?'왼손등이 목표를 보면 페이스가 정사각, 손목이 돌면 닫힙니다.':
    st.img==='pathHook'?'클럽이 안쪽에서 들어와 밖으로 나가며 페이스가 닫히면 훅.':
    st.img==='pathSlice'?'클럽이 밖에서 들어와 안으로 지나가며 페이스가 열리면 슬라이스.':
    st.img==='pathLine'?'손이 목표선을 따라 움직이는지 확인합니다.':
    st.img==='headStill'?'머리는 고정이 아니라 중심 유지 — 좌우 3cm 이내.':
    st.img==='shoulderTurn'?'어깨 90°, 골반 45°가 기준입니다.':
    st.img==='weight'?'임팩트에서 왼발 70%.':
    st.img==='earlyExt'?'엉덩이가 공 쪽으로 나오면 최저점이 밀립니다.':
    st.img==='handFirst'?'그립이 공보다 왼쪽에 있어야 눌러 칩니다.':
    st.img==='armPit'?'오른팔꿈치를 몸에 붙여야 경로가 안정됩니다.':
    st.img==='ballPos'?'볼 위치는 가장 빠른 손잡이입니다.':
    '양손 압력은 2/10(치약 짜듯).')+'</div>';
  h+='<div class="kv"><b>이렇게 하세요</b><ul>';
  st.how.forEach(function(x){h+='<li>'+x+'</li>';});
  h+='</ul></div>';
  h+='<div class="kv ok"><b>느낌 · 성공 신호</b><p>'+esc(st.feel)+'<br><span style="color:#8BF0B4">✓ '+esc(st.ok)+'</span></p></div>';
  h+='<div class="kv no"><b>이렇게 하면 안 됩니다</b><p>'+esc(st.mis)+'</p></div>';
  if(ST.tried.length){
    h+='<div class="tried">';
    ST.tried.forEach(function(t){h+='<span>해봄 · '+esc(t)+'</span>';});
    h+='</div>';
  }
  h+='<div class="nav">';
  h+='<button class="btn pri big" id="btnNo" type="button">해봤는데 안 돼요 → 다음 경로</button>';
  h+='<button class="btn big" id="btnYes" type="button">이제 됐어요</button>';
  h+='<button class="btn ghost" id="btnBack" type="button">증상 다시 고르기</button>';
  h+='</div>';
  h+='<p class="note">순서대로 하다가 안 되면 다음 원인으로 넘어갑니다. ‘됐어요’를 누르면 오늘 연습 3개와 저장 카드가 나옵니다.</p>';
  $('#app').innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
  $('#btnNo').addEventListener('click',nextStep);
  $('#btnYes').addEventListener('click',function(){finish(true);});
  $('#btnBack').addEventListener('click',screenPick);
}
function nextStep(){
  var S1=ST.sym,c=S1.causes[ST.cause];
  ST.tried.push(c.name+' · '+(ST.step+1)+'단계');
  if(ST.step+1<c.steps.length){
    ST.step++;ST.reroute=false;renderStep();
    toast('같은 원인의 '+(ST.step+1)+'단계로 이어갑니다');
    return;
  }
  if(ST.cause+1<S1.causes.length){
    ST.cause++;ST.step=0;ST.reroute=true;renderStep();
    toast('경로 재탐색 — 다른 원인으로 안내합니다');
    return;
  }
  finish(false);
}
function finish(ok){
  var S1=ST.sym,c=S1.causes[ST.cause];
  ST.done=true;ST.win=ok?c:null;
  var h='';
  if(ok){
    h+='<section class="card"><p class="succ">✓ 고쳤습니다 — '+esc(S1.name)+' / '+esc(c.name)+'</p>';
    h+='<p class="slead" style="margin-top:2px">오늘 필드에서 이 3개만 기억하세요. 집에서 10분 연습하면 다음 라운드에 그대로 나옵니다.</p>';
    h+='<ol class="drill">';
    c.steps.forEach(function(s,i){h+='<li><b>'+esc(s.t)+'</b><br><span style="color:#AFBDD0;font-size:12.5px">'+esc(s.ok)+'</span></li>';});
    h+='</ol></section>';
  }else{
    h+='<section class="card"><p class="succ" style="color:#FFD79A">여기까지가 혼자 할 수 있는 범위입니다</p>';
    h+='<p class="slead">세 가지 원인을 모두 시도했는데 그대로라면 스윙 문제가 아니라 <b>장비 또는 몸의 가동범위</b>일 가능성이 큽니다. 레슨 프로에게 아래 3가지를 그대로 말하면 시간을 아낍니다.</p>';
    h+='<div class="graybox">① 어떤 증상이 나오는지(훅/슬라이스/뒤땅/토핑)<br>② 어느 클럽에서 심한지(드라이버/아이언/웨지)<br>③ 위 교정 중 어떤 단계까지 해봤는지<br><br><b>장비 점검</b> — 그립 두께, 샤프트 강도, 라이각. 3년 이상 그립을 안 갈았다면 먼저 교체하세요.</div>';
    h+='<p class="warn">통증이 있거나 손목·허리가 아프면 연습을 멈추고 전문의에게 확인하세요.</p></section>';
  }
  h+='<section class="card"><h2><span class="n">!</span>통증이 있다면</h2><p class="note">스윙 교정은 통증 치료가 아닙니다. 손목·팔꿈치·허리 통증이 2주 이상 이어지면 병원을 먼저 가세요.</p></section>';
  h+='<div class="acts"><button class="btn pri" id="btnSave" type="button">저장 (그림·텍스트)</button>'+
     '<button class="btn" id="btnShare" type="button">공유</button>'+
     '<button class="btn wide" id="btnAgain" type="button">다른 증상 교정하기</button></div>';
  $('#app').innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
  $('#btnSave').addEventListener('click',saveAll);
  $('#btnShare').addEventListener('click',shareIt);
  $('#btnAgain').addEventListener('click',function(){ST={sym:null,cause:0,step:0,tried:[],done:false,win:null,reroute:false};screenPick();});
}

/* ---------- 저장/공유 ---------- */
function linesOf(){
  var S1=ST.sym,o=[];
  o.push('■ 증상: '+S1.name+' ('+S1.short+')');
  if(ST.win){
    o.push('■ 원인: '+ST.win.name);
    o.push('');
    o.push('오늘 연습 3개');
    ST.win.steps.forEach(function(s,i){
      o.push((i+1)+'. '+s.t);
      o.push('   하는 법: '+s.how[0].replace(/<[^>]+>/g,''));
      o.push('   성공 신호: '+s.ok);
    });
  }else{
    o.push('■ 세 원인 모두 시도 — 레슨·장비 점검 권장');
    o.push('전달할 것: 증상 / 심한 클럽 / 해본 단계');
  }
  o.push('');
  o.push('교정: autooneclick.com/golf/');
  return o;
}
function svgToImage(svg){
  return new Promise(function(res){
    try{
      var img=new Image();
      img.onload=function(){res(img);};img.onerror=function(){res(null);};
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    }catch(e){res(null);}
  });
}
function drawCard(img){
  var W=900,H=1240,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var g=cv.getContext('2d');
  g.fillStyle='#0A1128';g.fillRect(0,0,W,H);
  g.fillStyle='#0F1B33';g.fillRect(0,0,W,150);
  g.fillStyle='#FF6B00';g.fillRect(0,0,14,H);
  g.fillStyle='#FF6B00';g.font='bold 26px "Malgun Gothic",sans-serif';g.fillText('골프 스윙 교정 내비',64,58);
  g.fillStyle='#F3F6FA';g.font='bold 40px "Malgun Gothic",sans-serif';
  g.fillText((ST.sym?ST.sym.name:'')+' 교정',64,112);
  g.fillStyle='#AFBDD0';g.font='22px "Malgun Gothic",sans-serif';
  g.fillText(ST.win?('원인 · '+ST.win.name.slice(0,26)):'세 원인 모두 시도 — 레슨 권장',64,146);
  var y=176;
  if(img){
    var bandH=Math.round(760*(250/360));
    g.fillStyle='#0B1526';g.fillRect(64,y,772,bandH);
    g.drawImage(img,64,y,772,bandH);
    y+=bandH+26;
  }
  g.font='22px "Malgun Gothic",sans-serif';
  function out(s,color,bold,size){
    g.fillStyle=color||'#DCE6F6';g.font=(bold?'bold ':'')+(size||22)+'px "Malgun Gothic",sans-serif';
    var t='',ws=String(s).split(' ');
    for(var i=0;i<ws.length;i++){
      var tt=t?t+' '+ws[i]:ws[i];
      if(g.measureText(tt).width>772&&t){g.fillText(t,64,y);y+=32;t=ws[i];}
      else t=tt;
    }
    if(t)g.fillText(t,64,y);
    y+=34;
  }
  linesOf().slice(2).forEach(function(L){
    if(y>H-130)return;
    if(/^■/.test(L)){y+=6;out(L,'#FFA24D',true,24);}
    else if(/^\d\./.test(L))out(L,'#8BF0B4',true);
    else out(L);
  });
  g.fillStyle='#1D4ED8';g.fillRect(0,H-84,W,84);
  g.fillStyle='#fff';g.font='bold 30px "Malgun Gothic",sans-serif';g.textAlign='center';
  g.fillText('autooneclick.com',W/2,H-32);g.textAlign='left';
  return cv;
}
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},3000);}
async function saveAll(){
  try{
    var st=ST.win?ST.win.steps[0]:null;
    var img=st?await svgToImage(FIG[st.img]?FIG[st.img]():''):null;
    drawCard(img).toBlob(function(b){if(b)dl(b,'골프교정_'+stamp()+'.png');});
    dl(new Blob([linesOf().join('\n')],{type:'text/plain;charset=utf-8'}),'골프교정_'+stamp()+'.txt');
    toast('그림과 텍스트를 저장했습니다');
  }catch(e){toast('저장이 막혔습니다 — 공유로 시도해 주세요');}
}
function shareIt(){
  var txt=linesOf().join('\n');
  try{
    if(navigator.share){navigator.share({title:'골프 스윙 교정',text:txt}).catch(function(){});}
    else copy(txt);
  }catch(e){copy(txt);}
}
function copy(t){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){toast('복사했습니다');},function(){toast('복사가 막혔습니다');});return;}
  var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('복사했습니다');}catch(e){toast('복사가 막혔습니다');}ta.remove();
}

screenPick();
})();
</script>
