<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1128">
<title>가구 배치 전/후 — 인테리어 예시</title>
<meta name="description" content="가구 위치만 바꾼 전/후 사진을 밀어서 비교합니다. 벽·바닥 마감과 조명은 인테리어 화면에서 고릅니다.">
<link rel="icon" href="../icon.png">
<style>
:root{--bg:#0A1128;--bg2:#0A1224;--card:#0F1B33;--card2:#12203C;--line:#26375F;--line2:#2E4370;
--ink:#F3F6FA;--ink2:#AFBDD0;--gray:#8FA0B8;--or:#FF6B00;--or2:#FFA24D;--on:#0A1224;--warn:#FCD34D}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.55;padding-bottom:60px;-webkit-text-size-adjust:100%}
a{color:var(--or2)}
button{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.hd{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:8px;height:54px}
.hd .back{color:var(--ink2);text-decoration:none;font-size:13px;padding:8px 0;white-space:nowrap}
.hd h1{flex:1;min-width:0;font-size:16px;margin:0;line-height:1.3;word-break:keep-all}
.hd h1 small{display:block;font-size:11px;color:var(--gray);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px;word-break:keep-all}
.ba{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#16264A;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;outline:none;min-height:46vh}
.ba:focus-visible{box-shadow:0 0 0 3px rgba(255,162,77,.6)}
.ba canvas{display:block;width:100%;height:auto;min-height:46vh;object-fit:cover}
.ba canvas.af{position:absolute;left:0;top:0;width:100%;height:100%}
.ba .lb{position:absolute;top:8px;font-size:11.5px;font-weight:900;padding:3px 9px;border-radius:999px;background:rgba(10,17,40,.78);color:#fff;border:1px solid rgba(255,255,255,.25);pointer-events:none;max-width:46%;line-height:1.3;border-radius:10px}
.ba .lb.l{left:8px}.ba .lb.r{right:8px;background:rgba(255,107,0,.9);color:var(--on);border-color:transparent}
.ba .dv{position:absolute;top:0;bottom:0;width:0;border-left:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.6);pointer-events:none}
.ba .kn{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:48px;height:44px;border-radius:22px;background:#fff;color:var(--on);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 8px rgba(0,0,0,.45);touch-action:none;cursor:grab}
.ba .err{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#16264A;font-size:13.5px;font-weight:800;text-align:center;padding:12px}
.rng{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--gray)}
.rng input{flex:1;min-width:0;height:36px;accent-color:#FF6B00}
.cap{font-size:12px;color:var(--gray);margin:7px 0 0;line-height:1.55;word-break:keep-all}
.mini{min-height:36px;border:1px solid var(--line2);border-radius:9px;background:var(--card2);color:var(--ink2);font-size:12px;font-weight:800;cursor:pointer;padding:5px 10px}
.btn{min-height:46px;border:1px solid var(--line2);border-radius:11px;background:var(--card2);color:var(--ink);font-size:13.5px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;padding:6px 8px;margin-top:10px}
.btn.p{background:linear-gradient(135deg,#FF6B00,#FFA24D);color:var(--on);border-color:var(--or)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:rgba(10,17,40,.97);border:1px solid rgba(255,107,0,.5);color:#fff;font-size:13px;font-weight:800;padding:9px 14px;border-radius:999px;max-width:90%;text-align:center;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header class="hd"><div class="wrap">
  <a class="back" href="index.html">← 인테리어로</a>
  <h1>가구 배치 전/후<small>가구 위치만 바꾼 예시 · 구조는 바뀌지 않습니다</small></h1>
</div></header>

<main class="wrap">
  <section class="card">
    <h2>배치 전 → 후, 밀어서 보기</h2>
    <div class="ba" id="baLayout" tabindex="0" role="slider" aria-label="가구 배치 전후 비교 분할선" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
      <canvas class="bf" width="1200" height="900"></canvas>
      <canvas class="af" width="1200" height="900"></canvas>
      <span class="lb l" id="layLbA">배치 전</span><span class="lb r" id="layLbB">배치 후</span>
      <i class="dv"></i><span class="kn" aria-hidden="true">◀ ▶</span>
      <div class="err" id="layoutErr" hidden>사진을 불러오지 못했습니다<button class="mini" type="button" id="layoutRetry">다시 시도</button></div>
    </div>
    <div class="rng"><span>전</span><input type="range" min="0" max="100" value="50" id="rngLayout" aria-label="가구 배치 전후 비교 위치"><span>후</span></div>
    <p class="cap" id="layCap">가구 위치만 바꾼 예시입니다. 벽·바닥 마감과 조명은 인테리어 화면에서 고르면 그 값이 견적에 들어갑니다.</p>
    <a class="btn p" href="index.html">인테리어에서 마감·조명 고르기</a>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2400);}
function Gauge(el,rng){
  var dv=$('.dv',el), kn=$('.kn',el), af=$('canvas.af',el), pos=50, drag=false, pend=null;
  function set(p){p=parseFloat(p);if(!isFinite(p))p=50;pos=Math.max(0,Math.min(100,Math.round(p*10)/10));
    af.style.clipPath='inset(0 0 0 '+pos+'%)'; af.style.webkitClipPath='inset(0 0 0 '+pos+'%)';
    dv.style.left=pos+'%'; kn.style.left='clamp(24px,'+pos+'%,calc(100% - 24px))'; rng.value=pos; el.setAttribute('aria-valuenow',Math.round(pos));}
  function fromX(cx){var r=el.getBoundingClientRect();set((cx-r.left)/r.width*100);}
  function cap(e){try{el.setPointerCapture(e.pointerId);}catch(x){}}
  el.addEventListener('pointerdown',function(e){
    if(e.target.closest('.err')) return;
    if(e.pointerType==='mouse'||e.target.closest('.kn')){drag=true;pend=null;cap(e);fromX(e.clientX);e.preventDefault();return;}
    pend={x:e.clientX,y:e.clientY};
  });
  el.addEventListener('pointermove',function(e){
    if(!drag&&pend){var dx=e.clientX-pend.x, dy=e.clientY-pend.y;
      if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){drag=true;cap(e);} else if(Math.abs(dy)>8) pend=null;}
    if(drag){fromX(e.clientX);e.preventDefault();}
  });
  function end(e){drag=false;pend=null;try{el.releasePointerCapture(e.pointerId);}catch(x){}}
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){set(pos-5);e.preventDefault();} else if(e.key==='ArrowRight'){set(pos+5);e.preventDefault();}
    else if(e.key==='Home'){set(0);e.preventDefault();} else if(e.key==='End'){set(100);e.preventDefault();}
  });
  rng.addEventListener('input',function(){set(rng.value);});
  this.set=set; this.pos=function(){return pos;};
  set(50);
}
var g=new Gauge($('#baLayout'),$('#rngLayout'));
var imgCache={};
function loadImg(src,cb){
  var c=imgCache[src];
  if(c&&c.img){cb(c.img);return;}
  if(c&&c.wait){c.wait.push(cb);return;}
  c=imgCache[src]={img:null,wait:[cb]};
  var p=new Image();
  p.onload=function(){c.img=p;var w=c.wait;c.wait=null;w.forEach(function(f){f(p);});};
  p.onerror=function(){var w=c.wait;delete imgCache[src];w.forEach(function(f){f(null);});};
  p.src=src;
}
function drawLayout(sel){
  var lay=(sel&&sel.layout)||{before:{file:'img/living_setA.jpg',label:'배치 전 · 소파 왼쪽'},after:{file:'img/living_setB.jpg',label:'배치 후 · 소파 오른쪽 + 식탁'}}, el=$('#baLayout'), got={}, left=2;
  if(lay.before.label) $('#layLbA').textContent=lay.before.label;
  if(lay.after.label) $('#layLbB').textContent=lay.after.label;
  [['bf',lay.before.file],['af',lay.after.file]].forEach(function(q){
    loadImg(q[1],function(img){
      got[q[0]]=img; if(--left) return;
      var ok=!!(got.bf&&got.af); $('#layoutErr').hidden=ok; if(!ok) return;
      ['bf','af'].forEach(function(c){var cv=$('canvas.'+c,el),x=cv.getContext('2d');x.clearRect(0,0,1200,900);x.drawImage(got[c],0,0,1200,900);});
    });
  });
}
$('#layoutRetry').addEventListener('click',function(){drawLayout(null);fetch('regions.json?v=20261124b',{cache:'no-cache'}).then(function(r){return r.json();}).then(drawLayout).catch(function(){});});
fetch('regions.json?v=20261124b',{cache:'no-cache'}).then(function(r){return r.json();}).then(drawLayout).catch(function(){drawLayout(null);});
window.__KTS_FURN=function(){return {gauge:g.pos(),ok:!$('#layoutErr')||$('#layoutErr').hidden};};
})();
</script>
<script src="../helper.js?v=20261125a"></script>
</body>
</html>
