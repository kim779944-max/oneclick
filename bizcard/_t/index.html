<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>전자명함 390 검수 하네스</title>
<style>
body{margin:0;padding:10px;background:#0b0b0b;color:#eee;font:12px/1.45 ui-monospace,Menlo,monospace}
iframe{border:1px solid #666;display:block;margin:8px 0;background:#000}
pre{white-space:pre-wrap;margin:0}
</style></head>
<body>
<div id="frames"></div>
<pre id="report">running...</pre>
<script>
var LOG=[]; function out(s){LOG.push(s); document.getElementById('report').textContent=LOG.join('\n');}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function mk(w,h,url){
  var f=document.createElement('iframe'); f.width=w; f.height=h;
  document.getElementById('frames').appendChild(f);
  return new Promise(function(res){
    f.addEventListener('load',function(){ res(f) },{once:true});
    f.src=url;
  });
}
function del(f){ if(f&&f.parentNode) f.parentNode.removeChild(f); }
function doc(f){ return f.contentDocument }
function win(f){ return f.contentWindow }
function m(f){
  var d=doc(f), w=win(f);
  var q=function(s){ return d.querySelector(s) };
  var r=function(s){ var e=q(s); return e? e.getBoundingClientRect() : null };
  var rect=function(e){ return e? {top:Math.round(e.top),bottom:Math.round(e.bottom),h:Math.round(e.height)} : null };
  return {
    innerH: w.innerHeight, innerW: w.innerWidth,
    scrollH: d.documentElement.scrollHeight,
    overflow: d.documentElement.scrollHeight - w.innerHeight,
    overflowX: d.documentElement.scrollWidth - w.innerWidth,
    hash: w.location.hash, search: w.location.search,
    errs: (w.__errs||[]).slice(0,6),
    cards: d.querySelectorAll('#v-card .gcard').length,
    secText: (q('#v-card .sec-h span')||{}).textContent||'',
    avatar: (function(){var i=q('#v-card .av img'); return i? (i.naturalWidth+'x'+i.naturalHeight) : 'none'})(),
    badge: (q('#v-card .badge')||{}).textContent||'',
    edge: (q('#v-card .medals .edge')||{}).textContent||'',
    intro: (q('#v-card .intro')||{}).textContent||'',
    acts: d.querySelectorAll('#v-card .pact').length,
    bizH: rect(r('#v-card .biz')),
    gridH: rect(r('#v-card .grid3')),
    wide: rect(r('#v-card .wide')),
    tiny: rect(r('#v-card .tiny')),
    navTop: Math.round(r('#bnav').top),
    thumbs: Array.prototype.map.call(d.querySelectorAll('#v-card .gth img'),function(i){return i.naturalWidth}),
    tableRows: d.querySelectorAll('#v-new .obj-table tr').length,
    tableText: (function(){var t=q('#v-new .obj-table'); return t? t.textContent.replace(/\s+/g,' ').slice(0,180):''})(),
    bodyScroll: (function(){var b=d.body; return b? b.scrollHeight:0})()
  };
}
async function run(){
  var W=390;
  var sizes=[660,844];
  for (var i=0;i<sizes.length;i++){
    var H=sizes[i];
    out('=== '+W+'x'+H+' ===');
    var f=await mk(W,H,'../index.html?reset=1&dev=1&r='+Date.now());
    await sleep(400);
    doc(f).querySelector('#btnDemoMe').click();
    await sleep(1800);
    var a=m(f); out(JSON.stringify(a));
    out('  판정: 세로스크롤 '+(a.overflow>0?'있음 '+a.overflow+'px':'없음')+' / 전체보기 하단 '+a.wide.bottom+' <= 탭바 '+a.navTop+' : '+(a.wide.bottom<=a.navTop?'OK':'넘침'));
    del(f);
  }
  /* 별표 필터링 */
  out('=== 별표(★) 필터링 390x660 ===');
  var g=await mk(390,660,'../index.html?reset=1&dev=1&r='+Date.now());
  await sleep(400);
  doc(g).querySelector('#btnDemoMe').click();
  await sleep(1200);
  out('  예시 상태 카드수='+doc(g).querySelectorAll('#v-card .gcard').length+' / '+doc(g).querySelector('#v-card .sec-h span').textContent);
  win(g).location.hash='#/list';
  await sleep(500);
  var stars=doc(g).querySelectorAll('#v-list [data-star]');
  out('  매물장 매물='+stars.length);
  stars[0].click();
  await sleep(400);
  win(g).location.hash='#/card';
  await sleep(500);
  var b=m(g);
  out('  별표 1개 뺀 뒤 카드수='+b.cards+' / '+b.secText+' / 전체='+ (doc(g).querySelector('#v-card .wide span')||{}).textContent);
  /* 별표 모두 끄기 */
  win(g).location.hash='#/list';
  await sleep(400);
  Array.prototype.forEach.call(doc(g).querySelectorAll('#v-list [data-star].on'),function(el){el.click()});
  await sleep(400);
  win(g).location.hash='#/card';
  await sleep(500);
  out('  별표 0개: 카드수='+doc(g).querySelectorAll('#v-card .gcard').length+' / 안내문='+(!!doc(g).querySelector('.star-empty'))+' / 전체보기='+(doc(g).querySelector('#v-card .wide span')||{}).textContent);
  del(g);

  /* 공유(share_target) 진입 */
  out('=== 공유 진입 ?text= 390x660 ===');
  var sample='[한빛부동산] 가평 북면 목동리 271 임야 3,967㎡(1,200평) 매매 3억8천 보전관리 전원주택지 010-2345-6789';
  var s=await mk(390,660,'../index.html?dev=1&title='+encodeURIComponent('한빛부동산 매물')+'&text='+encodeURIComponent(sample)+'&r='+Date.now());
  await sleep(900);
  var c=m(s);
  out('  hash='+c.hash+' / search="'+c.search+'" / 물건표 행수='+c.tableRows);
  out('  표 내용: '+c.tableText);
  out('  errs='+JSON.stringify(c.errs));
  /* 담기 */
  var btn=doc(s).querySelector('#btnSave');
  out('  담기 버튼='+(!!btn));
  if(btn){ btn.click(); await sleep(1200); out('  담은 뒤 hash='+win(s).location.hash+' / 전체건수='+(doc(s).querySelector('#v-card .wide span')||{}).textContent); }
  del(s);
  out('DONE');
}
run().catch(function(e){ out('HARNESS ERROR '+e); });
</script>
</body></html>
