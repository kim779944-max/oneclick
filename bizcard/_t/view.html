<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>전자명함 화면 보기</title>
<style>body{margin:0;padding:8px;background:#0b0b0b}iframe{border:0;display:block;background:#0b132b}</style>
</head><body>
<iframe id="f" src="../index.html"></iframe>
<script>
var p=new URLSearchParams(location.search);
var w=+(p.get('w')||390), h=+(p.get('h')||660), v=p.get('v')||'card';
var f=document.getElementById('f');
f.width=w; f.height=h;
f.addEventListener('load',function(){
  var d=f.contentDocument, win=f.contentWindow;
  setTimeout(function(){
    if(v==='card'){
      var b=d.querySelector('#btnDemoMe'); if(b) b.click();
    } else if(v==='setup'){
      var p2=d.querySelector('#btnSampleMe'); if(p2) p2.click();
    }
    setTimeout(function(){ document.title='READY '+w+'x'+h; }, 1200);
  },400);
});
f.src='../index.html?reset=1&dev=1&v='+Date.now();
</script>
</body></html>
