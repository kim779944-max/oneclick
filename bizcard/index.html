<body>

<div id="app">
  <header class="hd">
    <a class="brand" href="#/card">
      <img src="icon-192.png" alt="" width="26" height="26">
      <span>전자명함 <b>매물장</b></span>
    </a>
    <span class="sp"></span>
    <a class="hd-btn" href="#/new">문자 넣기</a>
  </header>

  <main>
    <section id="v-card" class="view"></section>
    <section id="v-list" class="view"></section>
    <section id="v-new" class="view"></section>
    <section id="v-detail" class="view"></section>
    <section id="v-price" class="view"></section>
    <section id="v-setup" class="view"></section>
  </main>

  <nav id="bnav">
    <div class="in">
      <a href="#/card" data-t="card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.6-1.4 1.7-2 3-2s2.4.6 3 2"/><path d="M14 10h4M14 13.5h3"/></svg>

      <a href="#/price" data-t="price">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l2.8 12L12 8l5.2 10L20 6"/><path d="M6 11h12M6 14h12"/></svg>
        <span>요금</span>
      </a>
    </div>
  </nav>
</div>

<div id="sheet">
  <div class="sheet-in">
    <div class="grip"></div>
    <div class="sheet-h">
      <b id="aiTitle">AI 영업 비서</b>
      <button class="icob" id="aiX" aria-label="닫기">✕</button>
    </div>
    <div id="aiLog" class="ai-log"></div>
    <div id="aiChips" class="ai-chips"></div>
    <div id="aiInput" class="ai-input" hidden>
      <input id="aiText" type="text" placeholder="적어 주세요" autocomplete="off">
      <button type="button" class="btn sm main">전달</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- 직인 도장 QR 크게 보기 -->
<div id="sealBox" hidden>
  <div class="seal-card">
    <div class="seal-h"><b>직인 도장 QR</b><button class="icob" id="sealX" type="button" aria-label="닫기">✕</button></div>
    <div id="sealStage" class="seal-stage"></div>
    <p class="seal-note">휴대폰 카메라로 찍으면 전자명함이 열립니다. 손님에게 보여 주거나 저장해 인쇄물에 찍으세요.</p>
    <div class="seal-acts">
      <button class="btn sm main" id="sealSave" type="button">QR 이미지 저장</button>
      <button class="btn sm" id="sealShape" type="button">모양 바꾸기</button>
    </div>
  </div>
</div>

<script>
/* 개발·검수용(?dev=1)에서만 오류를 모아 화면에 보여 준다 */
if (/[?&]dev=1/.test(location.search)) {
  window.__errs = [];
  function __log(msg) {
    window.__errs.push(msg);
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = 'ERR ' + msg;
    t.classList.add('on');
  }
  window.addEventListener('error', function (e) {
    __log((e.message || 'script error') + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    __log('promise ' + ((e.reason && e.reason.message) || e.reason));
  });
}
</script>
