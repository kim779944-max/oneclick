<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390×844 검수 창</title>
<style>
  html,body{margin:0;background:#1b1b1b;display:flex;justify-content:center;padding:18px}
  iframe{width:390px;height:844px;border:0;background:#000;border-radius:10px;box-shadow:0 0 0 1px #444}
</style>
</head>
<body>
  <iframe id="f" src="./index.html?dev=1"></iframe>
  <script>
    /* 검수 때마다 새로 받도록 (캐시 때문에 옛 화면이 보이는 것 방지) */
    document.getElementById('f').src = './index.html?dev=1&t=' + Date.now();
  </script>
</body>
</html>
