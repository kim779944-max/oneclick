<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>cors test</title></head>
<body style="font:16px monospace;background:#111;color:#0f0">
<pre id="out">testing...</pre>
<script>
var KEY = '0C4AD93D-75D2-447B-B533-C5ADDD4A5B2F';
var lat = 36.9527, lon = 126.5234;
function satUrl() {
  return 'https://api.vworld.kr/req/image?service=image&request=getmap&key=' + KEY + '&domain=autooneclick.com'
    + '&format=png&basemap=PHOTO_HYBRID&center=' + lon + ',' + lat + '&zoom=16&size=400,300&crs=EPSG:4326';
}
function cadUrl(withDomain) {
  return 'https://api.vworld.kr/req/image?service=image&request=getmap&key=' + KEY
    + (withDomain ? '&domain=autooneclick.com' : '') + '&format=png&basemap=GRAPHIC_WHITE'
    + '&layers=lp_pa_cbnd_bonbun,lp_pa_cbnd_bubun&center=' + lon + ',' + lat + '&zoom=17&size=400,300&crs=EPSG:4326';
}
var lines = [];
function say(s) { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); }
function test(name, url, cors) {
  return new Promise(function (res) {
    var t0 = Date.now(), im = new Image(), done = false;
    function fin(s) { if (done) return; done = true; say(name + ' cors=' + cors + ' → ' + s + ' (' + (Date.now() - t0) + 'ms)'); res(); }
    if (cors) im.crossOrigin = 'anonymous';
    im.onload = function () {
      var taint = 'clean';
      try { var c = document.createElement('canvas'); c.width = 8; c.height = 8; c.getContext('2d').drawImage(im, 0, 0, 8, 8); c.toDataURL(); }
      catch (e) { taint = e.name; }
      fin('LOADED ' + im.naturalWidth + 'x' + im.naturalHeight + ' canvas=' + taint);
    };
    im.onerror = function () { fin('ERROR'); };
    im.src = url;
    setTimeout(function () { fin('TIMEOUT'); }, 12000);
  });
}
(async function () {
  await test('sat', satUrl(), true);
  await test('sat', satUrl(), false);
  await test('cad+domain', cadUrl(true), true);
  await test('cad-nodomain', cadUrl(false), true);
  await test('cad-nodomain', cadUrl(false), false);
  say('done');
})();
</script>
</body></html>
