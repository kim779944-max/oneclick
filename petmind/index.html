<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1128">
<title>강아지·고양이 마음 번역기 — 행동전문가 버전</title>
<meta name="description" content="비슷해 보이지만 뜻이 다른 꼬리·귀·자세·소리를 그림으로 비교해 고르면, 행동학 근거와 함께 주인이 지금 바로 할 수 있는 1·2·3 교정과 하면 안 되는 행동을 알려 드립니다.">
<link rel="icon" href="../icon.png">
<style>
:root{--bg:#0A1128;--bg2:#0A1224;--card:#0F1B33;--card2:#12203C;--line:#26375F;--line2:#2E4370;
--ink:#F3F6FA;--ink2:#AFBDD0;--gray:#8FA0B8;--or:#FF6B00;--or2:#FFA24D;--on:#0A1224;
--ok:#4ADE80;--red:#FF5C6C;--warn:#FCD34D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.55;padding-bottom:74px;-webkit-text-size-adjust:100%}
a{color:var(--or2)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.hd{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--line)}
.hd .wrap{display:flex;align-items:center;gap:8px;height:54px}
.hd .back{color:var(--ink2);text-decoration:none;font-size:13px;padding:8px 0;white-space:nowrap}
.hd h1{flex:1;min-width:0;font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd h1 small{display:block;font-size:11px;color:var(--gray);font-weight:400}
.hero{margin:12px 0 0;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(255,107,0,.14),rgba(255,255,255,.02) 65%)}
.hero b{display:block;font-size:15.5px;margin-bottom:4px;letter-spacing:-.3px}
.hero span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.card h2 .n{display:inline-flex;width:22px;height:22px;border-radius:11px;background:var(--or);color:var(--on);font-size:12px;align-items:center;justify-content:center;font-weight:800}
.species{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.species button{min-height:58px;border-radius:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
.species button.on{border-color:var(--or);background:#2a1a08;color:var(--or2)}
.species button span{display:block;font-size:11px;color:var(--gray);font-weight:400;margin-top:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card2);color:var(--ink2);border-radius:999px;padding:7px 12px;font-family:inherit;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--or);background:#2a1a08;color:var(--or2);font-weight:800}
.optgrid{display:grid;gap:10px;margin-top:10px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:0;overflow:hidden;color:var(--ink);font-family:inherit;cursor:pointer}
.opt:active,.opt:hover{border-color:var(--or)}
.opt svg{display:block;width:100%;height:auto;background:#0B1526}
.opt .lab{display:block;padding:9px 12px 11px}
.opt .lab b{display:block;font-size:14px;line-height:1.4;margin-bottom:2px}
.opt .lab span{display:block;font-size:11.5px;color:var(--gray)}
.opt.sel{border-color:var(--ok)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .opt .lab b{font-size:12.5px}
.pair .opt .lab span{font-size:10.5px}
.cta{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--or);color:var(--on);font-size:17px;font-weight:900;margin:8px 0 4px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 13px;border-radius:11px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);font-family:inherit;font-size:13.5px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--or);border-color:var(--or);color:var(--on);font-weight:900}
.btn.big{min-height:50px;font-size:15px;font-weight:800}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;font-size:12.5px;padding:0 9px}
.headline{font-size:22px;font-weight:900;letter-spacing:-.5px;margin:0 0 4px;line-height:1.3;word-break:keep-all}
.sub{font-size:13px;color:var(--ink2);margin:0 0 10px;line-height:1.6}
.kv{border-top:1px solid var(--line);padding:10px 0 0;margin:10px 0 0}
.kv b{display:block;font-size:11.5px;color:var(--or2);font-weight:800;margin-bottom:4px;letter-spacing:.2px}
.kv p{margin:0;font-size:13.5px;line-height:1.7;color:#E4EBF5;word-break:keep-all}
.kv.no b{color:#FFB6C0}
.kv.ok b{color:#8BF0B4}
.kv.vet b{color:#FCD34D}
.dos{counter-reset:d;margin:0;padding:0;list-style:none}
.dos li{position:relative;padding:9px 0 9px 30px;font-size:13.5px;line-height:1.68;border-top:1px dashed var(--line)}
.dos li:first-child{border-top:0}
.dos li::before{counter-increment:d;content:counter(d);position:absolute;left:0;top:9px;width:20px;height:20px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);color:var(--or2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ban{background:#3a1520;border:1px solid #7a2f3a;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;color:#FFD7DC;margin:8px 0 0}
.ban b{color:#fff;display:block;margin-bottom:3px;font-size:11.5px;letter-spacing:.2px}
.vetbox{background:#2a2008;border:1px solid #7a6120;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;color:#FFE9A8;margin:8px 0 0}
.vetbox b{color:#FFF3B0;display:block;margin-bottom:3px;font-size:11.5px}
.note{font-size:11.5px;color:var(--gray);line-height:1.6;margin:8px 0 0}
.warn{font-size:11.5px;color:var(--warn);line-height:1.6;margin:7px 0 0}
.graybox{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;color:var(--ink2);line-height:1.7}
.graybox b{color:var(--ink)}
.mic{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mic .dot{width:9px;height:9px;border-radius:50%;background:#4E5B73}
.mic .dot.on{background:var(--red);box-shadow:0 0 10px rgba(255,92,108,.8)}
.meter{flex:1 1 100%;height:8px;border-radius:4px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#4ADE80,#FFA24D,#FF5C6C);transition:width .08s}
.readout{font-size:12px;color:var(--ink2);margin-top:6px;min-height:18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 6px}
.acts .btn{min-height:48px;font-size:14px;font-weight:800}
.acts .btn.pri{grid-column:1/-1}
.acts .wide{grid-column:1/-1}
.pill{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;border:1px solid;margin:0 4px 6px 0}
.pill.live{color:#8BF0B4;border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.12)}
.pill.info{color:#FFD79A;border-color:rgba(255,162,77,.45);background:rgba(255,162,77,.12)}
.sitebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,#1D4ED8,#15379B);border-top:1px solid #3B6BE8}
.sitebar a{display:flex;align-items:center;justify-content:center;gap:7px;height:46px;color:#fff;text-decoration:none;font-size:14px;font-weight:800}
.sitebar a i{font-style:normal;font-size:10.5px;font-weight:700;color:#C7D7FF;background:rgba(255,255,255,.14);border-radius:6px;padding:1px 6px}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:60;background:#1d2c4f;border:1px solid var(--or);border-radius:999px;padding:9px 15px;font-size:13.5px;max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media print{.sitebar,.acts,.cta{display:none}body{padding-bottom:0}}
</style>
</head>
<body>
<header class="hd"><div class="wrap">
  <a class="back" href="https://autooneclick.com/">← 쇼룸</a>
  <h1>마음 번역기<small>행동전문가 · 비교해서 고르기</small></h1>
</div></header>

<main class="wrap"><div id="app"></div></main>

<footer class="sitebar"><a href="https://autooneclick.com/">autooneclick.com <i>원클릭 도구</i></a></footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);},$$=function(s){return [].slice.call(document.querySelectorAll(s));};
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},2400);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function stamp(){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());}

/* =========================================================
   그림(SVG) — 같은 동작의 두 얼굴을 나란히 비교
   (실루엣은 회색, 지금 봐야 할 부위는 주황)
   ========================================================= */
var UID=0;
function S(w,h,build){
  UID++;
  var ar='ar'+UID,ag='ag'+UID,ared='rd'+UID,cl='#C9D6E8',ln='#8FA0B8';
  var defs='<defs>'+
    '<marker id="'+ar+'" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#FF6B00"/></marker>'+
    '<marker id="'+ag+'" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4ADE80"/></marker>'+
    '<marker id="'+ared+'" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#FF5C6C"/></marker>'+
    '</defs>';
  return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg" role="img">'+defs+
    '<rect width="'+w+'" height="'+h+'" fill="#0B1526"/>'+build(ar,ag,ared,cl,ln)+'</svg>';
}
function T(x,y,s,size,color,anchor,weight){
  return '<text x="'+x+'" y="'+y+'" font-size="'+(size||11)+'" font-family="Malgun Gothic,Noto Sans KR,sans-serif" fill="'+(color||'#8FA0B8')+'" text-anchor="'+(anchor||'start')+'" font-weight="'+(weight||700)+'">'+s+'</text>';
}
function A(id,d,color,width){
  return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="'+(width||3)+'" stroke-linecap="round" marker-end="url(#'+id+')"/>';
}
function GROUND(){return '<ellipse cx="160" cy="180" rx="96" ry="7" fill="#12203C"/>';}

/* 강아지 옆모습 — 실루엣 */
function dogSVG(p){
  p=p||{};
  var tail=p.tail||'wag',ear=p.ear||'fwd',body=p.body||'stand',mouth=p.mouth||'closed';
  return S(320,200,function(ar,ag,ared,cl,ln){
    var s=GROUND();
    var bx=92,by=110,bw=118,bh=52,hx=238,hy=92;
    if(body==='bow'){by=98;hx=246;hy=138;}
    if(body==='crouch'){by=126;hx=232;hy=110;}
    // legs
    var ly=body==='crouch'?154:156;
    s+='<rect x="104" y="'+ly+'" width="12" height="'+(178-ly)+'" rx="6" fill="'+cl+'"/>';
    s+='<rect x="124" y="'+ly+'" width="12" height="'+(178-ly)+'" rx="6" fill="'+cl+'"/>';
    s+='<rect x="170" y="'+ly+'" width="12" height="'+(178-ly)+'" rx="6" fill="'+cl+'"/>';
    s+='<rect x="190" y="'+ly+'" width="12" height="'+(178-ly)+'" rx="6" fill="'+cl+'"/>';
    // neck + body
    s+='<path d="M'+(bx+bw-26)+','+(by+24)+' L'+(hx-14)+','+(hy+18)+'" stroke="'+cl+'" stroke-width="18" stroke-linecap="round"/>';
    s+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" rx="'+(bh/2)+'" fill="'+cl+'"/>';
    // head
    s+='<circle cx="'+hx+'" cy="'+hy+'" r="23" fill="'+cl+'"/>';
    s+='<rect x="'+(hx+13)+'" y="'+(hy-3)+'" width="32" height="18" rx="9" fill="'+cl+'"/>';
    s+='<circle cx="'+(hx+41)+'" cy="'+(hy+6)+'" r="4.2" fill="#0A1128"/>';
    s+='<circle cx="'+(hx-7)+'" cy="'+(hy-7)+'" r="3.2" fill="#0A1128"/>';
    if(mouth==='open'){
      s+='<path d="M'+(hx+18)+','+(hy+12)+' q9,11 18,0" fill="#7A2230"/>';
      s+='<path d="M'+(hx+22)+','+(hy+13)+' q6,7 12,0" fill="#FF8FA3"/>';
    }else if(mouth==='lick'){
      s+='<path d="M'+(hx+16)+','+(hy+12)+' q10,-1 16,-9" fill="none" stroke="#FF8FA3" stroke-width="5" stroke-linecap="round"/>';
    }
    // ear (feature) — 머리 뒤쪽에 붙은 귀
    var ec='#FF6B00';
    if(ear==='fwd'){
      s+='<path d="M'+(hx-24)+','+(hy-6)+' q2,-20 18,-18 q6,12 -2,20 q-9,6 -16,-2 z" fill="'+ec+'"/>';
      s+='<path d="M'+(hx-22)+','+(hy-2)+' q-2,14 8,16 q4,-10 -2,-16 z" fill="#D9730F"/>';
    }else if(ear==='up'){
      s+='<path d="M'+(hx-18)+','+(hy-12)+' q-2,-24 14,-24 q9,12 2,26 z" fill="'+ec+'"/>';
      s+='<path d="M'+(hx-22)+','+(hy-8)+' q-4,12 6,15 q4,-8 0,-15 z" fill="#D9730F"/>';
    }else{
      s+='<path d="M'+(hx-16)+','+(hy-12)+' q-18,-6 -20,8 q10,10 22,4 z" fill="'+ec+'"/>';
      s+='<path d="M'+(hx-10)+','+(hy-16)+' q-14,-10 -18,2 q10,8 20,4 z" fill="#D9730F"/>';
    }
    // tail (feature)
    var tx=bx+2,ty=by+24;
    if(tail==='wag'){
      s+='<path d="M'+tx+','+ty+' C'+(tx-24)+','+(ty-16)+' '+(tx-44)+','+(ty-10)+' '+(tx-54)+','+(ty+12)+'" fill="none" stroke="#FF6B00" stroke-width="10" stroke-linecap="round"/>';
      s+=A(ar,'M'+(tx-62)+','+(ty+30)+' q-6,-14 4,-22','#FF6B00',2.6);
      s+=A(ar,'M'+(tx-64)+','+(ty-6)+' q14,-8 24,0','#FF6B00',2.6);
      s+=A(ar,'M'+(tx-60)+','+(ty+8)+' q12,2 14,12','#FF6B00',2.6);
    }else if(tail==='high'){
      s+='<path d="M'+tx+','+ty+' C'+(tx-14)+','+(ty-28)+' '+(tx-8)+','+(ty-58)+' '+(tx+8)+','+(ty-70)+'" fill="none" stroke="#FF6B00" stroke-width="10" stroke-linecap="round"/>';
      s+=A(ared,'M'+(tx+22)+','+(ty-62)+' q14,-2 16,10','#FF5C6C',2.4);
      s+=A(ared,'M'+(tx+20)+','+(ty-46)+' q14,-2 16,10','#FF5C6C',2.4);
      s+=A(ared,'M'+(tx+18)+','+(ty-30)+' q14,-2 16,10','#FF5C6C',2.4);
    }else{
      s+='<path d="M'+tx+','+ty+' C'+(tx-14)+','+(ty+24)+' '+(tx-2)+','+(ty+42)+' '+(tx+18)+','+(ty+40)+'" fill="none" stroke="#FF6B00" stroke-width="10" stroke-linecap="round"/>';
      s+=A(ared,'M'+(tx+30)+','+(ty+24)+' q6,16 -6,20','#FF5C6C',2.4);
    }
    return s;
  });
}
/* 고양이 옆모습 */
function catSVG(p){
  p=p||{};
  var tail=p.tail||'up',ear=p.ear||'fwd',body=p.body||'sit',eyes=p.eyes||'open';
  return S(320,200,function(ar,ag,ared,cl,ln){
    var s=GROUND();
    var by=body==='crouch'?152:(body==='loaf'?146:128);
    var bh=body==='crouch'?28:(body==='loaf'?30:38);
    var hx=224,hy=body==='crouch'?124:100;
    s+='<rect x="106" y="'+(by+10)+'" width="9" height="34" rx="4.5" fill="'+cl+'"/>';
    s+='<rect x="122" y="'+(by+12)+'" width="9" height="32" rx="4.5" fill="'+cl+'"/>';
    s+='<rect x="178" y="'+(by+12)+'" width="9" height="32" rx="4.5" fill="'+cl+'"/>';
    s+='<rect x="192" y="'+(by+10)+'" width="9" height="34" rx="4.5" fill="'+cl+'"/>';
    s+='<rect x="100" y="'+by+'" width="108" height="'+bh+'" rx="'+(bh/2)+'" fill="'+cl+'"/>';
    s+='<path d="M'+(182)+','+(by+10)+' L'+(hx-12)+','+(hy+16)+'" stroke="'+cl+'" stroke-width="15" stroke-linecap="round"/>';
    s+='<circle cx="'+hx+'" cy="'+hy+'" r="21" fill="'+cl+'"/>';
    // ears
    var ec=(ear==='fwd'||ear==='flat')?'#FF6B00':'#A9BBD4';
    if(ear==='fwd'){
      s+='<path d="M'+(hx-17)+','+(hy-14)+' L'+(hx-14)+','+(hy-34)+' L'+(hx-2)+','+(hy-17)+' z" fill="'+ec+'"/>';
      s+='<path d="M'+(hx+5)+','+(hy-16)+' L'+(hx+15)+','+(hy-35)+' L'+(hx+18)+','+(hy-13)+' z" fill="'+ec+'"/>';
    }else{
      s+='<path d="M'+(hx-16)+','+(hy-8)+' L'+(hx-38)+','+(hy-2)+' L'+(hx-16)+','+(hy-22)+' z" fill="'+ec+'"/>';
      s+='<path d="M'+(hx+6)+','+(hy-10)+' L'+(hx+28)+','+(hy-2)+' L'+(hx+14)+','+(hy-22)+' z" fill="'+ec+'"/>';
    }
    // eyes
    if(eyes==='closed')s+='<path d="M'+(hx-10)+','+(hy-2)+' q4,4 8,0 M'+(hx+4)+','+(hy-3)+' q4,4 8,0" fill="none" stroke="#0A1128" stroke-width="2.2"/>';
    else if(eyes==='wide')s+='<circle cx="'+(hx-6)+'" cy="'+(hy-2)+'" r="4" fill="#0A1128"/><circle cx="'+(hx+8)+'" cy="'+(hy-3)+'" r="4" fill="#0A1128"/>';
    else s+='<circle cx="'+(hx-6)+'" cy="'+(hy-2)+'" r="2.6" fill="#0A1128"/><circle cx="'+(hx+8)+'" cy="'+(hy-3)+'" r="2.6" fill="#0A1128"/>';
    s+='<path d="M'+(hx+13)+','+(hy+6)+' l6,0 l-3,4 z" fill="#FF8FA3"/>';
    // tail
    var tx=102,ty=by+16;
    if(tail==='up'){
      s+='<path d="M'+tx+','+ty+' C'+(tx-18)+','+(ty-22)+' '+(tx-18)+','+(ty-52)+' '+(tx-2)+','+(ty-66)+'" fill="none" stroke="#FF6B00" stroke-width="7" stroke-linecap="round"/>';
      s+='<path d="M'+(tx-2)+','+(ty-66)+' q12,-6 16,4" fill="none" stroke="#FF6B00" stroke-width="7" stroke-linecap="round"/>';
      s+=A(ag,'M'+(tx+22)+','+(ty-72)+' q10,10 4,20','#4ADE80',2.2);
    }else if(tail==='tip'){
      s+='<path d="M'+tx+','+ty+' C'+(tx-18)+','+(ty-10)+' '+(tx-30)+','+(ty-30)+' '+(tx-26)+','+(ty-50)+'" fill="none" stroke="#FF6B00" stroke-width="7" stroke-linecap="round"/>';
      s+=A(ar,'M'+(tx-20)+','+(ty-58)+' q10,0 12,10','#FF6B00',2.2);
      s+=A(ar,'M'+(tx-10)+','+(ty-54)+' q10,0 12,10','#FF6B00',2.2);
    }else{
      s+='<path d="M'+tx+','+ty+' C'+(tx-22)+','+(ty+6)+' '+(tx-44)+','+(ty-6)+' '+(tx-56)+','+(ty-30)+'" fill="none" stroke="#FF6B00" stroke-width="7" stroke-linecap="round"/>';
      s+=A(ar,'M'+(tx-64)+','+(ty-40)+' q-8,12 0,22','#FF6B00',2.4);
      s+=A(ar,'M'+(tx-52)+','+(ty+14)+' q-12,4 -16,-6','#FF6B00',2.4);
    }
    return s;
  });
}
/* 소리 — 파형 */

/* 묶음: 옵션 그림 */
function figFor(o){
  if(o.fig==='wave')return waveSVG(o.k);
  if(o.fig==='ear')return earSVG(o.k);
  if(o.fig==='mouth')return mouthSVG(o.k);
  if(o.fig==='pose')return poseSVG(o.k);
  if(o.fig==='rep')return repSVG(o.k);
  if(o.fig==='cat')return catSVG({tail:o.tail||'up',ear:o.ear||'fwd',body:o.body||'sit',eyes:o.eyes||'open'});
  return dogSVG({tail:o.tail||'wag',ear:o.ear||'fwd',body:o.body||'stand',mouth:o.mouth||'closed'});
}

function findOpt(key){
  var c=optionsOf();if(!c)return null;
  for(var i=0;i<c.opts.length;i++){var o=c.opts[i];if((o.k||o.kind)===key)return o;}
  return null;
}

  h+='</div>';
  h+='<section class="card"><h2><span class="n">1</span>무엇이 궁금합니까?</h2><div class="chips" id="cats">';

  h+='<section class="card"><h2><span class="n">2</span>소리로도 확인 (마이크)</h2>';
  h+='<div class="mic"><span class="dot" id="micDot"></span><b id="micState" style="font-size:13px">대기</b><button class="btn sm" id="btnMic" type="button">3초 듣기</button></div>';

  h+='<p class="note">이 도구는 수의학 진단이 아닙니다. 아픈 신호가 보이면 병원이 먼저입니다.</p>';

  $$('[data-cat]').forEach(function(b){b.addEventListener('click',function(){ST.cat=b.getAttribute('data-cat');screenPick();});});

}

  var c=optionsOf(),o=findOpt(ST.opt);

  h+='</div>';

     '<button class="btn" id="btnShare" type="button">공유</button>'+
     '<button class="btn wide" id="btnAgain" type="button">다른 행동 보기</button></div>';

  $('#app').innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
  $('#btnSave').addEventListener('click',saveAll);
  $('#btnShare').addEventListener('click',shareIt);
  $('#btnAgain').addEventListener('click',screenPick);

/* ---------- 마이크(음높이·크기만) ---------- */
var micStream=null,micRAF=null;
function micStart(){
  var dot=$('#micDot'),state=$('#micState'),bar=$('#meterBar'),out=$('#micOut');
  if(micStream){stopMic();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    state.textContent='이 브라우저에서는 마이크를 쓸 수 없습니다';
    out.textContent='휴대폰 브라우저에서 https 주소로 열면 사용할 수 있습니다.';
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    micStream=stream;
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var src=ctx.createMediaStreamSource(stream);
    var an=ctx.createAnalyser();an.fftSize=2048;src.connect(an);
    var td=new Uint8Array(an.fftSize),fd=new Uint8Array(an.frequencyBinCount);
    var peaks=0,last=0,t0=Date.now(),maxRms=0,freqs=[];
    dot.classList.add('on');state.textContent='듣는 중… 3초';
    $('#btnMic').textContent='멈추기';
    function loop(){
      an.getByteTimeDomainData(td);an.getByteFrequencyData(fd);
      var sum=0,peak=0,bi=0,bv=0;
      for(var i=0;i<td.length;i++){var v=(td[i]-128)/128;sum+=v*v;if(Math.abs(v)>peak)peak=Math.abs(v);}
      for(var j=0;j<fd.length;j++){if(fd[j]>bv){bv=fd[j];bi=j;}}
      var rms=Math.sqrt(sum/td.length);
      if(rms>maxRms)maxRms=rms;
      var f=bi*ctx.sampleRate/an.fftSize;
      if(rms>0.02){if(Date.now()-last>220)peaks++;last=Date.now();freqs.push(f);}
      bar.style.width=Math.min(100,Math.round(rms*320))+'%';
      if(Date.now()-t0<3000){micRAF=requestAnimationFrame(loop);return;}
      stopMic(true);
      var avg=freqs.length?freqs.reduce(function(a,b){return a+b;},0)/freqs.length:0;
      var kind=avg<600?'낮은 소리(경계·불만 쪽)':(peaks>=3?'짧게 반복(요구·흥분 쪽)':'길게 이어짐(요구·불편 쪽)');
      out.innerHTML='평균 음높이 <b>'+Math.round(avg)+'Hz</b> · 소리 낸 횟수 <b>'+peaks+'회</b> · 최대 크기 <b>'+Math.round(maxRms*100)+'%</b><br>→ '+kind+'<br><span style="color:#8FA0B8">음높이·길이만 본 결과입니다. 아래 행동 체크와 함께 판단하세요.</span>';
      state.textContent='측정 완료';
    }
    loop();
  }).catch(function(){
    state.textContent='마이크 권한이 필요합니다';
    out.textContent='주소창의 자물쇠 → 마이크 허용 후 다시 눌러 주세요. (file:// 로 열면 막힙니다)';
  });
}
function stopMic(done){
  if(micRAF){cancelAnimationFrame(micRAF);micRAF=null;}
  if(micStream){micStream.getTracks().forEach(function(t){t.stop();});micStream=null;}
  var dot=$('#micDot');if(dot)dot.classList.remove('on');
  var btn=$('#btnMic');if(btn)btn.textContent='3초 듣기';
  var bar=$('#meterBar');if(bar&&!done)bar.style.width='0%';
}

/* ---------- 저장/공유 ---------- */
function linesOf(){
  var c=optionsOf(),o=findOpt(ST.opt),L=[];
  L.push('■ '+(ST.sp==='dog'?'강아지':'고양이')+' · '+c.name);
  L.push('■ '+o.line);
  L.push('');
  L.push('지금 뜻: '+o.label);
  L.push(o.why.replace(/<[^>]+>/g,''));
  L.push('');
  L.push('지금 바로 1·2·3');
  o.dos.forEach(function(d,i){L.push((i+1)+'. '+d.replace(/<[^>]+>/g,''));});
  L.push('');
  L.push('하지 마세요');
  o.ban.forEach(function(b){L.push('· '+b);});
  if(o.vet){L.push('');L.push('병원 신호: '+o.vet);}
  L.push('');
  L.push('행동 번역: autooneclick.com/petmind/');
  return L;
}
function svgToImage(svg){
  return new Promise(function(res){
    try{var img=new Image();img.onload=function(){res(img);};img.onerror=function(){res(null);};
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}catch(e){res(null);}
  });
}
function drawCard(img){
  var W=900,H=1240,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var g=cv.getContext('2d');var c=optionsOf(),o=findOpt(ST.opt);
  g.fillStyle='#0A1128';g.fillRect(0,0,W,H);
  g.fillStyle='#0F1B33';g.fillRect(0,0,W,150);
  g.fillStyle='#FF6B00';g.fillRect(0,0,14,H);
  g.fillStyle='#FF6B00';g.font='bold 26px "Malgun Gothic",sans-serif';g.fillText('마음 번역기 · 행동전문가',64,58);
  g.fillStyle='#F3F6FA';g.font='bold 36px "Malgun Gothic",sans-serif';
  var tw=o.label,line2='';
  if(g.measureText(tw).width>770){line2=tw.slice(36);tw=tw.slice(0,36)+'…';}
  g.fillText(tw,64,108);
  if(line2){g.font='bold 26px "Malgun Gothic",sans-serif';g.fillText(line2,64,142);}
  var y=180;
  if(img){
    var bh=Math.round(760*(200/320));
    g.fillStyle='#0B1526';g.fillRect(64,y,772,bh);
    g.drawImage(img,64,y,772,bh);y+=bh+22;
  }
  g.font='22px "Malgun Gothic",sans-serif';
  function out(s,color,bold,size){
    g.fillStyle=color||'#DCE6F6';g.font=(bold?'bold ':'')+(size||22)+'px "Malgun Gothic",sans-serif';
    var t='',ws=String(s).split(' ');
    for(var i=0;i<ws.length;i++){
      var tt=t?t+' '+ws[i]:ws[i];
      if(g.measureText(tt).width>772&&t){g.fillText(t,64,y);y+=32;t=ws[i];}
      else t=tt;
    }
    if(t)g.fillText(t,64,y);
    y+=34;
  }
  out('“'+o.line+'”','#FFA24D',true,26);y+=6;
  linesOf().slice(3).forEach(function(L){
    if(y>H-130)return;
    if(/^지금 뜻|^지금 바로|^하지 마세요|^병원/.test(L)){y+=4;out(L,'#FFA24D',true,23);}
    else if(/^\d\./.test(L))out(L,'#8BF0B4',true);
    else out(L);
  });
  g.fillStyle='#1D4ED8';g.fillRect(0,H-84,W,84);
  g.fillStyle='#fff';g.font='bold 30px "Malgun Gothic",sans-serif';g.textAlign='center';
  g.fillText('autooneclick.com',W/2,H-32);g.textAlign='left';
  return cv;
}
function dl(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},3000);}
async function saveAll(){
  try{
    var o=findOpt(ST.opt);
    var img=await svgToImage(figFor(o));
    drawCard(img).toBlob(function(b){if(b)dl(b,'마음번역_'+stamp()+'.png');});
    dl(new Blob([linesOf().join('\n')],{type:'text/plain;charset=utf-8'}),'마음번역_'+stamp()+'.txt');
    toast('그림과 텍스트를 저장했습니다');
  }catch(e){toast('저장이 막혔습니다 — 공유로 시도해 주세요');}
}
function shareIt(){
  var txt=linesOf().join('\n');
  try{
    if(navigator.share){
      var o=findOpt(ST.opt);
      svgToImage(figFor(o)).then(function(img){
        drawCard(img).toBlob(function(b){
          if(b&&navigator.canShare&&navigator.canShare({files:[new File([b],'마음번역.png',{type:'image/png'})]})){
            navigator.share({title:'마음 번역기',text:txt,files:[new File([b],'마음번역.png',{type:'image/png'})]}).catch(function(){});
          }else navigator.share({title:'마음 번역기',text:txt}).catch(function(){});
        });
      });
    }else copy(txt);
  }catch(e){copy(txt);}
}
function copy(t){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(function(){toast('복사했습니다');},function(){toast('복사가 막혔습니다');});return;}
  var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('복사했습니다');}catch(e){toast('복사가 막혔습니다');}ta.remove();
}

screenHome();
})();
