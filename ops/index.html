<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AI 군단 상황판 — KTS</title>
<meta name="theme-color" content="#0A1128">
<script src="../master.js?v=20261121k"></script>
<style>
  :root{
    --navy:#0A1128; --navy2:#0D1730; --card:#101D3A; --card2:#0B1530;
    --line:#1E2C4E; --line2:#27395F;
    --orange:#FF6B00; --orange-soft:#FF8A33;
    --ink:#E8EDF7; --ink2:#A9B7D0; --ink3:#7688A6;
    --green:#22C55E; --blue:#3B82F6; --amber:#F59E0B; --gray:#94A3B8;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--navy);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding-bottom:calc(28px + var(--safe-b))}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  /* ── 상단 ── */
  .top{position:sticky;top:0;z-index:20;background:rgba(10,17,40,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:12px 14px 10px}
  .top .row{display:flex;align-items:center;gap:9px}
  .brand{font-size:15px;font-weight:800;letter-spacing:-.2px}
  .brand .k{color:var(--orange)}
  .tagline{font-size:11px;color:var(--ink3);margin-top:2px}
  .spacer{flex:1}
  .mini{font-size:11px;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;
    padding:6px 10px;display:inline-flex;align-items:center;gap:5px}
  .mini:active{background:#16233f}

  .wrap{padding:14px 14px 0;max-width:960px;margin:0 auto}

  /* ── 요약 ── */
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .sum .s{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 11px}
  .sum .n{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .sum .l{font-size:11px;color:var(--ink2);margin-top:1px;display:flex;align-items:center;gap:5px}

  .led{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
  .led.g{background:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.16)}
  .led.b{background:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.16)}
  .led.a{background:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.16)}
  .led.o{background:var(--orange);box-shadow:0 0 0 3px rgba(255,107,0,.18);animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ── 긴급 알림 ── */
  .notice{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
  .nt{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.45;
    background:#1A1430;border:1px solid #4A2A1E}
  .nt.u{border-color:#6B2A12;background:#1E1220}
  .nt .bar{width:3px;align-self:stretch;border-radius:3px;background:var(--orange);flex:none;margin-top:2px}
  .nt b{font-weight:700}
  .nt span.d{color:var(--ink2);display:block;margin-top:2px}

  /* ── 조직도 ── */
  .org{background:linear-gradient(180deg,#0C1834,#0A1128);border:1px solid var(--line);border-radius:18px;
    padding:14px 12px 16px;margin-bottom:14px;position:relative;overflow:hidden}
  .org:before{content:"";position:absolute;inset:-40% 30% auto -30%;height:180px;
    background:radial-gradient(closest-side,rgba(255,107,0,.16),transparent);pointer-events:none}
  .node{position:relative;display:flex;align-items:center;gap:11px;border-radius:14px;padding:11px 12px;
    background:var(--card);border:1px solid var(--line2)}
  .node .av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
    background:#16264A;border:1px solid var(--line2)}
  .node .nm{font-size:14px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
  .node .rl{font-size:11px;color:var(--ink3);margin-top:2px}
  .node.owner{border-color:#2C3B60}
  .node.chief{border-color:rgba(255,107,0,.45);background:linear-gradient(180deg,#15203c,#111a33);
    box-shadow:0 6px 22px -12px rgba(255,107,0,.6)}
  .node .task{font-size:11.5px;color:var(--orange-soft);margin-top:4px;line-height:1.4}
  .plain{font-size:10px;color:var(--ink3);display:inline-flex;align-items:center;gap:4px;
    border:1px solid var(--line2);border-radius:999px;padding:2px 7px}

  .vline{width:1px;height:12px;background:var(--line2);margin:0 auto}
  .vline.dim{background:linear-gradient(180deg,var(--line2),rgba(39,57,95,.2))}

  .depts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:2px}
  @media(min-width:720px){.depts{grid-template-columns:repeat(5,1fr)}}
  .dept{position:relative;text-align:left;border-radius:14px;padding:11px 10px 10px;
    background:var(--card2);border:1px solid var(--line);transition:border-color .15s,transform .12s}
  .dept:active{transform:scale(.985)}
  .dept.active{border-color:rgba(255,107,0,.55);background:#121f3d}
  .dept .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    background:#16264A;border:1px solid var(--line2);margin-bottom:8px}
  .dept .nm{font-size:12.5px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
  .dept .sb{font-size:10px;color:var(--ink3);margin-top:2px;line-height:1.3}
  .dept .cnt{display:flex;gap:7px;margin-top:8px;font-size:10.5px;color:var(--ink2)}
  .dept .cnt i{font-style:normal;display:inline-flex;align-items:center;gap:3px}
  .dept .blk{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
  .dept.last{grid-column:span 2}
  @media(min-width:720px){.dept.last{grid-column:auto}}

  /* ── 부서 상세 ── */
  .sheet{position:fixed;inset:0;z-index:40;display:none}
  .sheet.on{display:block}
  .scrim{position:absolute;inset:0;background:rgba(4,8,18,.66);backdrop-filter:blur(2px)}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow:auto;
    background:var(--navy2);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;
    padding:14px 14px calc(18px + var(--safe-b));animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
  .panel .hd{display:flex;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--navy2);
    padding:4px 0 10px;z-index:2}
  .panel .hd .nm{font-size:16px;font-weight:800;letter-spacing:-.3px}
  .panel .hd .sb{font-size:11px;color:var(--ink3);margin-top:2px}
  .panel .hd .x{margin-left:auto;width:32px;height:32px;border-radius:10px;border:1px solid var(--line2);
    display:grid;place-items:center;font-size:15px;color:var(--ink2)}
  .sec{margin-top:14px}
  .sec .sh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink2);
    letter-spacing:-.2px;margin-bottom:8px}
  .sec .sh .n{font-size:11px;color:var(--ink3);font-weight:600}
  .it{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 11px;margin-bottom:7px}
  .it .t{font-size:13px;font-weight:700;line-height:1.4;letter-spacing:-.2px}
  .it .d{font-size:11.5px;color:var(--ink2);line-height:1.5;margin-top:3px}
  .it .src{font-size:10.5px;color:var(--ink3);margin-top:6px;display:flex;align-items:center;gap:5px}
  .it.doing{border-color:rgba(59,130,246,.38)}
  .it.done{opacity:.92}
  .it.done .t:before{content:"✓";color:var(--green);font-weight:800;margin-right:6px}
  .empty{font-size:11.5px;color:var(--ink3);padding:6px 2px}

  .foot{margin:18px auto 0;max-width:960px;padding:0 14px;font-size:11px;color:var(--ink3);line-height:1.6}
  .foot a{color:var(--ink2);text-decoration:underline;text-underline-offset:2px}

  /* ── PIN ── */
  .gate{position:fixed;inset:0;z-index:60;background:var(--navy);display:flex;align-items:center;
    justify-content:center;padding:22px}
  .gate.off{display:none}
  .gate .box{width:100%;max-width:330px;text-align:center}
  .gate .lg{font-size:12px;color:var(--ink3);letter-spacing:.06em}
  .gate h1{font-size:19px;margin:8px 0 4px;letter-spacing:-.4px}
  .gate p{font-size:11.5px;color:var(--ink2);line-height:1.55;margin:0 0 18px}
  .gate .pinrow{display:flex;gap:8px;justify-content:center}
  .gate input{width:150px;height:50px;border-radius:12px;background:#0E1A36;border:1px solid var(--line2);
    color:var(--ink);font-size:22px;letter-spacing:.42em;text-align:center;font-weight:800;outline:none}
  .gate input:focus{border-color:var(--orange)}
  .gate .go{width:70px;height:50px;border-radius:12px;background:var(--orange);color:#180800;font-weight:800;font-size:14px}
  .gate .err{color:#FF8A8A;font-size:11.5px;height:16px;margin-top:9px}
  .gate .back{display:inline-block;margin-top:16px;font-size:11.5px;color:var(--ink3)}
</style>
</head>
<body>

<!-- PIN 2899 대표님 전용 -->
<div class="gate off" id="gate">
  <div class="box">
    <div class="lg">KTS 대표님 전용</div>
    <h1>AI 군단 상황판</h1>
    <p>부서별 할 일 · 하는 일 · 완료를 한눈에 보는 관리자 화면입니다.<br>마스터 비밀번호 4자리를 넣어 주세요.</p>
    <div class="pinrow">
      <input id="pin" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="비밀번호 4자리">
      <button class="go" id="pinGo">열기</button>
    </div>
    <div class="err" id="pinErr"></div>
    <a class="back" href="../" target="_blank" rel="noopener">← 원클릭 쇼룸으로</a>
  </div>
</div>

<header class="top">
  <div class="row">
    <div>
      <div class="brand"><span class="k">AI 군단</span> 상황판</div>
      <div class="tagline">대표님 전용 · 부서별 진행 현황</div>
    </div>
    <div class="spacer"></div>
    <button class="mini" id="btnReload"><span class="led o" id="liveLed"></span>새로고침</button>
  </div>
</header>

<main class="wrap">
  <div class="sum">
    <div class="s"><div class="n" id="sDoing">–</div><div class="l"><span class="led b"></span>하는 일</div></div>
    <div class="s"><div class="n" id="sTodo">–</div><div class="l"><span class="led a"></span>할 일</div></div>
    <div class="s"><div class="n" id="sDone">–</div><div class="l"><span class="led g"></span>완료</div></div>
  </div>

  <div class="notice" id="notice"></div>

  <section class="org">
    <div class="node owner">
      <div class="av">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6B00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V7l7-4z"/></svg>
      </div>
      <div>
        <div class="nm" id="ownerName">대표님</div>
        <div class="rl">총괄 · 최종 결정</div>
      </div>
      <div class="spacer"></div>
      <span class="plain"><span class="led g"></span>결재선</span>
    </div>

    <div class="vline"></div>

    <div class="node chief">
      <div class="av">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8A33" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 8.5l5.4-.8L12 2.8z"/></svg>
      </div>
      <div style="min-width:0">
        <div class="nm" id="chiefName">지니 <span class="plain"><span class="led o"></span><span id="chiefState">가동 중</span></span></div>
        <div class="rl" id="chiefRole">총괄 비서실장</div>
        <div class="task" id="chiefTask"></div>
      </div>
    </div>

    <div class="vline dim"></div>

    <div class="depts" id="depts"></div>
  </section>
</main>

<div class="foot">
  <div id="stamp">불러오는 중…</div>
  <div style="margin-top:6px">지니가 작업을 시작하고 끝낼 때마다 이 판(<b>ops/status.json</b>)을 갱신합니다. 부서를 누르면 상세가 열립니다.</div>
  <div style="margin-top:6px"><a href="../">원클릭 쇼룸</a> · <a href="#" id="lock">잠그기</a></div>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="scrim" id="scrim"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pName">
    <div class="hd">
      <div>
        <div class="nm" id="pName">부서</div>
        <div class="sb" id="pSub"></div>
      </div>
      <button class="x" id="pClose" aria-label="닫기">✕</button>
    </div>
    <div id="pBody"></div>
  </div>
</div>

<script>
(function(){
  var ICONS = {
    code:'<path d="M8.5 8.5L5 12l3.5 3.5M15.5 8.5L19 12l-3.5 3.5M13.4 6.2l-2.8 11.6"/>',
    megaphone:'<path d="M4 11v2.4a1.6 1.6 0 0 0 1.6 1.6H8l7 4V6.9l-7 4H5.6A1.6 1.6 0 0 0 4 11z"/><path d="M18.4 9.2a4 4 0 0 1 0 5.6"/>',
    box:'<path d="M12 3.4l7.4 3.7v9.8L12 20.6 4.6 16.9V7.1L12 3.4z"/><path d="M4.6 7.1L12 10.8l7.4-3.7M12 10.8v9.8"/>',
    building:'<path d="M5 20V5.4h9V20M14 11h5v9M8 8.6h3M8 12h3M8 15.4h3M17 14.2h0M17 17h0"/>',
    monitor:'<rect x="3.4" y="5" width="17.2" height="11" rx="1.8"/><path d="M9 20h6M12 16v4"/>'
  };
  function icon(k, c){
    return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="'+(c||'#FF8A33')+
      '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[k]||ICONS.code)+'</svg>';
  }
  var $ = function(s){ return document.querySelector(s); };
  var DATA = null, CUR = -1;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  function fmtTime(iso){
    try{
      var d = new Date(iso);
      var p = function(n){ return (n<10?'0':'')+n; };
      return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
    }catch(e){ return iso; }
  }
  function ago(iso){
    var t = new Date(iso).getTime(); if (isNaN(t)) return '';
    var m = Math.round((Date.now()-t)/60000);
    if (m < 1) return '방금';
    if (m < 60) return m + '분 전';
    var h = Math.round(m/60); if (h < 24) return h + '시간 전';
    return Math.round(h/24) + '일 전';
  }

  function counts(dep){
    return { doing:(dep.doing||[]).length, todo:(dep.todo||[]).length, done:(dep.done||[]).length };
  }

  function render(){
    if (!DATA) return;
    var D = DATA;
    $('#ownerName').textContent = D.owner || '대표님';
    if (D.chief){
      $('#chiefName').innerHTML = esc(D.chief.name||'지니') +
        ' <span class="plain"><span class="led o"></span>' + esc(D.chief.state||'가동 중') + '</span>';
      $('#chiefRole').textContent = D.chief.role || '총괄 비서실장';
      var t = (D.chief.doing||[])[0];
      $('#chiefTask').textContent = t ? ('지금 · ' + t.t) : '';
    }
    var nd = 0, nt = 0, nc = 0;
    (D.departments||[]).forEach(function(dep){
      var c = counts(dep); nd += c.doing; nt += c.todo; nc += c.done;
    });
    if (D.chief) nd += (D.chief.doing||[]).length;
    $('#sDoing').textContent = nd; $('#sTodo').textContent = nt; $('#sDone').textContent = nc;

    var no = $('#notice'); no.innerHTML = '';
    (D.notice||[]).forEach(function(n){
      var d = document.createElement('div');
      d.className = 'nt' + (n.lv === 'urgent' ? ' u' : '');
      d.innerHTML = '<span class="bar"></span><div><b>' + esc(n.t) + '</b><span class="d">' + esc(n.d) + '</span></div>';
      no.appendChild(d);
    });

    var g = $('#depts'); g.innerHTML = '';
    (D.departments||[]).forEach(function(dep, i){
      var c = counts(dep);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'dept' + (i === (D.departments.length-1) && D.departments.length % 2 === 1 ? ' last' : '') + (CUR === i ? ' active' : '');
      b.innerHTML =
        (dep.blocked ? '<span class="blk" title="확인 필요"></span>' : '') +
        '<div class="ic">' + icon(dep.icon) + '</div>' +
        '<div class="nm">' + esc(dep.name) + '</div>' +
        '<div class="sb">' + esc(dep.sub||'') + '</div>' +
        '<div class="cnt">' +
          '<i><span class="led b"></span>' + c.doing + '</i>' +
          '<i><span class="led a"></span>' + c.todo + '</i>' +
          '<i><span class="led g"></span>' + c.done + '</i>' +
        '</div>';
      b.setAttribute('aria-label', dep.name + ' 상세 보기');
      b.onclick = function(){ openDep(i); };
      g.appendChild(b);
    });

    $('#stamp').innerHTML = '마지막 갱신 · <b>' + esc(fmtTime(D.updated)) + '</b> (' + esc(ago(D.updated)) + ') · ' + esc(D.updatedBy||'지니');
    $('#liveLed').className = 'led ' + (nd > 0 ? 'o' : 'g');
  }

  function item(it, kind){
    var d = document.createElement('div');
    d.className = 'it ' + kind;
    var led = kind === 'doing' ? '<span class="led b"></span>' : (kind === 'done' ? '<span class="led g"></span>' : '<span class="led a"></span>');
    d.innerHTML = '<div class="t">' + esc(it.t) + '</div>' +
      (it.d ? '<div class="d">' + esc(it.d) + '</div>' : '') +
      (it.src ? '<div class="src">' + led + esc(it.src) + '</div>' : '');
    return d;
  }
  function section(title, ledClass, arr, kind){
    var s = document.createElement('div'); s.className = 'sec';
    s.innerHTML = '<div class="sh"><span class="led ' + ledClass + '"></span>' + title +
      ' <span class="n">' + arr.length + '</span></div>';
    if (!arr.length){ var e = document.createElement('div'); e.className='empty'; e.textContent = '지금은 없습니다.'; s.appendChild(e); }
    arr.forEach(function(it){ s.appendChild(item(it, kind)); });
    return s;
  }

  function openDep(i){
    var dep = (DATA.departments||[])[i]; if (!dep) return;
    CUR = i; render();
    $('#pName').textContent = dep.name;
    $('#pSub').textContent = (dep.sub ? dep.sub + ' · ' : '') + (dep.blocked ? dep.blocked : '부서 상세');
    var body = $('#pBody'); body.innerHTML = '';
    body.appendChild(section('하는 일 (진행 중)', 'b', dep.doing||[], 'doing'));
    body.appendChild(section('할 일 (적립 대기)', 'a', dep.todo||[], 'todo'));
    body.appendChild(section('완료', 'g', dep.done||[], 'done'));
    $('#sheet').classList.add('on'); $('#sheet').setAttribute('aria-hidden','false');
  }
  function closeDep(){
    $('#sheet').classList.remove('on'); $('#sheet').setAttribute('aria-hidden','true');
    CUR = -1; render();
  }
  $('#pClose').onclick = closeDep;
  $('#scrim').onclick = closeDep;
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeDep(); });

  /* ── PIN 게이트 ── */
  function isMaster(){ return !!(window.KTS && window.KTS.isMaster && window.KTS.isMaster()); }
  var SS = 'kts_ops';
  function sess(v){
    try{ if (v === undefined) return sessionStorage.getItem(SS); sessionStorage.setItem(SS, v); }catch(e){}
    return null;
  }
  function allowed(){
    var s = sess();
    if (s === '0') return false;             /* 판에서 '잠그기'를 누른 경우 */
    return isMaster();                        /* 쇼룸 마스터 1회 인증이면 바로 열림 */
  }
  function gate(){
    if (allowed()){ $('#gate').classList.add('off'); return; }
    $('#gate').classList.remove('off');
  }
  $('#pinGo').onclick = function(){
    var v = ($('#pin').value || '').replace(/\D/g,'');
    if (window.KTS && window.KTS.setMaster && window.KTS.setMaster(v)){
      sess('1');
      $('#gate').classList.add('off');
      load();
    } else {
      $('#pinErr').textContent = '번호가 맞지 않습니다. 다시 넣어 주세요.';
      $('#pin').value = ''; $('#pin').focus();
    }
  };
  $('#pin').addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); $('#pinGo').click(); } });
  $('#lock').onclick = function(e){
    e.preventDefault();
    /* 판만 잠근다 — 쇼룸의 마스터 모드(무제한 열기)는 그대로 둔다 */
    sess('0');
    gate();
  };

  /* ── 데이터 ── */
  function load(){
    var url = 'status.json?t=' + Date.now();
    fetch(url, { cache:'no-store' }).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(j){ DATA = j; render(); })
    .catch(function(err){
      $('#stamp').textContent = '상황판 데이터를 불러오지 못했습니다 (' + err.message + ') · 새로고침해 주세요.';
    });
  }
  $('#btnReload').onclick = function(){ load(); };
  gate(); if (allowed()) load();
})();
</script>
</body>
</html>
